</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8a8a8a"/></marker><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#C0392B"/></marker></defs><rect width="1320" height="1080" fill="#ffffff"/><rect x="20" y="44" width="250" height="980" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="36" y="70">EXTERNAL</text><rect x="300" y="44" width="995" height="980" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="316" y="70">OPENSHIFT SNO "ROME" · RED HAT OPENSHIFT AI 3.5</text><g class="c-amber"><rect x="35" y="100" width="220" height="155" rx="8"/><text class="th" x="145" y="128" text-anchor="middle">MCP think-tank</text><text class="ts" x="145" y="154" text-anchor="middle">external reasoning server</text><text class="ts" x="145" y="172" text-anchor="middle">anomaly meaning →</text><text class="ts" x="145" y="190" text-anchor="middle">remediation-flow determination</text><text class="ts" x="145" y="208" text-anchor="middle">(separate namespace)</text></g><g class="c-green"><rect x="35" y="860" width="220" height="110" rx="8"/><text class="th" x="145" y="888" text-anchor="middle">RHOAI MaaS</text><text class="ts" x="145" y="914" text-anchor="middle">LiteLLM gateway ·</text><text class="ts" x="145" y="932" text-anchor="middle">alt model path</text></g><g class="c-blue"><rect x="330" y="100" width="225" height="185" rx="8"/><text class="th" x="442" y="128" text-anchor="middle">101 data plane · Feast</text><text class="ts" x="442" y="154" text-anchor="middle">anomaly_score / flag per NF</text><text class="ts" x="442" y="172" text-anchor="middle">(live on Rome) · online store</text><text class="ts" x="442" y="190" text-anchor="middle">+ telemetry MCP tools</text><text class="ts" x="442" y="208" text-anchor="middle">the loop’s sensor (course 101)</text></g><g class="tab-rhoai"><rect x="348" y="90" width="152" height="20" rx="6"/><text x="424" y="104" text-anchor="middle">RHOAI · Feature Store</text></g><g class="c-gray"><rect x="575" y="100" width="190" height="185" rx="8"/><text class="th" x="670" y="128" text-anchor="middle">Workflow state store</text><text class="ts" x="670" y="154" text-anchor="middle">findings · plans · results</text><text class="ts" x="670" y="172" text-anchor="middle">· rollbacks · externalized</text><text class="ts" x="670" y="190" text-anchor="middle">any worker can die and</text><text class="ts" x="670" y="208" text-anchor="middle">be retried (12-Factor)</text></g><g class="c-green"><rect x="785" y="100" width="215" height="185" rx="8"/><text class="th" x="892" y="128" text-anchor="middle">vLLM on RHOAI</text><text class="ts" x="892" y="154" text-anchor="middle">Kimi-Linear-48B-A3B (KServe)</text><text class="ts" x="892" y="172" text-anchor="middle">one stateless endpoint</text><text class="ts" x="892" y="190" text-anchor="middle">shared by all four agents</text><text class="ts" x="892" y="208" text-anchor="middle">and the plan-judge</text></g><g class="tab-rhoai"><rect x="803" y="90" width="107" height="20" rx="6"/><text x="856" y="104" text-anchor="middle">RHOAI · KServe</text></g><g class="c-blue"><rect x="1020" y="100" width="255" height="185" rx="8"/><text class="th" x="1147" y="128" text-anchor="middle">MLflow</text><text class="ts" x="1147" y="154" text-anchor="middle">workspace agent-school</text><text class="ts" x="1147" y="172" text-anchor="middle">traces per agent · per loop</text><text class="ts" x="1147" y="190" text-anchor="middle">iteration · co-decision +</text><text class="ts" x="1147" y="208" text-anchor="middle">overrides audited here</text></g><g class="tab-rhoai"><rect x="1038" y="90" width="107" height="20" rx="6"/><text x="1091" y="104" text-anchor="middle">RHOAI · MLflow</text></g><g class="c-agent"><rect x="470" y="395" width="575" height="175" rx="12"/><text class="agent-t" x="757" y="437" text-anchor="middle">Closed-loop NetOps agents</text><text class="ts" x="757" y="461" text-anchor="middle">four ephemeral pods · strict A2A hierarchy · CPU-only · restricted PSS</text><text class="agent-flow" x="757" y="497" text-anchor="middle">Diagnostic → Planning → Execution → Validation</text><text class="ts" x="757" y="525" text-anchor="middle">intelligence in the middle · deterministic code at both safety ends</text><text class="ts" x="757" y="543" text-anchor="middle">+ a plan-judge for Planning’s quant + qual co-decision</text></g><g class="tab-pod"><rect x="486" y="384" width="63" height="23" rx="6"/><text x="517" y="400" text-anchor="middle">4 PODs</text></g><rect x="300" y="650" width="560" height="320" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="316" y="676"></text><text class="tl" x="316" y="676" text-anchor="middle">PLANNING'S QUANT + QUAL CO-DECISION · grounds a plan before publish</text><g class="c-green"><rect x="330" y="702" width="240" height="175" rx="8"/><text class="th" x="450" y="730" text-anchor="middle">remediation-risk scorer</text><text class="ts" x="450" y="756" text-anchor="middle">netops-remediation-risk</text><text class="ts" x="450" y="774" text-anchor="middle">calibrated action-risk 0–1</text><text class="ts" x="450" y="792" text-anchor="middle">served on KServe · reached</text><text class="ts" x="450" y="810" text-anchor="middle">only via Kuadrant /plan-score</text></g><g class="tab-rhoai"><rect x="348" y="692" width="107" height="20" rx="6"/><text x="401" y="706" text-anchor="middle">RHOAI · KServe</text></g><g class="c-teal"><rect x="600" y="702" width="240" height="175" rx="8"/><text class="th" x="720" y="730" text-anchor="middle">plan-judge (OGX · A2A)</text><text class="ts" x="720" y="756" text-anchor="middle">the qualitative half ·</text><text class="ts" x="720" y="774" text-anchor="middle">grounds on the SAME</text><text class="ts" x="720" y="792" text-anchor="middle">governed score · verdict:</text><text class="ts" x="720" y="810" text-anchor="middle">accept / revise / reject</text></g><g class="tab-pod"><rect x="618" y="692" width="35" height="20" rx="6"/><text x="635" y="706" text-anchor="middle">POD</text></g><g class="tab-rhoai"><rect x="618" y="867" width="152" height="20" rx="6"/><text x="694" y="881" text-anchor="middle">RHOAI · Model Serving</text></g><rect x="895" y="650" width="380" height="320" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="911" y="676"></text><text class="tl" x="911" y="676" text-anchor="middle">GOVERNED ACTUATION</text><g class="c-amber"><rect x="1030" y="702" width="245" height="105" rx="8"/><text class="th" x="1152" y="730" text-anchor="middle">Kuadrant gateway</text><text class="ts" x="1152" y="756" text-anchor="middle">/mcp (actuate) + /plan-score</text><text class="ts" x="1152" y="774" text-anchor="middle">AuthPolicy + RateLimit</text></g><g class="tab-rhoai"><rect x="1048" y="692" width="120" height="20" rx="6"/><text x="1108" y="706" text-anchor="middle">RHOAI · Kuadrant</text></g><g class="c-amber"><rect x="1030" y="835" width="245" height="105" rx="8"/><text class="th" x="1152" y="863" text-anchor="middle">autonet playbooks (MCP)</text><text class="ts" x="1152" y="889" text-anchor="middle">scale AMF · restart SMF ·</text><text class="ts" x="1152" y="907" text-anchor="middle">rebalance UPF · audited</text></g><g class="tab-pod"><rect x="1048" y="825" width="35" height="20" rx="6"/><text x="1065" y="839" text-anchor="middle">POD</text></g><g class="c-gray"><rect x="905" y="835" width="105" height="105" rx="8"/><text class="th" x="957" y="863" text-anchor="middle">5G core</text><text class="ts" x="957" y="889" text-anchor="middle">AMF · SMF</text><text class="ts" x="957" y="907" text-anchor="middle">· UPF</text></g><polyline class="arrow-h" points="560,395 560,287" marker-end="url(#ah)"/><text class="tl" x="560" y="355" text-anchor="middle">① sense</text><polyline class="arrow" points="660,395 660,287" marker-end="url(#a)"/><text class="tl" x="683" y="355" text-anchor="middle">state</text><polyline class="arrow-h" points="800,395 800,287" marker-end="url(#ah)"/><text class="tl" x="800" y="355" text-anchor="middle">② reason</text><polyline class="arrow-h" points="950,395 950,340 1120,340 1120,287" marker-end="url(#ah)"/><text class="tl" x="1000" y="330" text-anchor="middle">③ observe</text><polyline class="arrow dashed" points="470,470 258,470 160,470 160,258" marker-end="url(#a)"/><text class="tl" x="372" y="462" text-anchor="middle">consult think-tank (MCP)</text><polyline class="arrow-h" points="555,570 555,698" marker-end="url(#ah)"/><text class="tl" x="500" y="640" text-anchor="middle">④ co-decide</text><polyline class="arrow-h" points="1045,500 1152,500 1152,698" marker-end="url(#ah)"/><text class="tl" x="1200" y="560" text-anchor="middle">⑤ actuate</text><polyline class="arrow dashed" points="600,790 572,790" marker-end="url(#a)"/><text class="tl" x="586" y="782" text-anchor="middle">grounds</text><polyline class="arrow" points="1152,807 1152,833" marker-end="url(#a)"/><polyline class="arrow" points="1030,887 1012,887" marker-end="url(#a)"/><polyline class="arrow dashed" points="145,860 145,560 466,560" marker-end="url(#a)"/><text class="tl" x="305" y="554" text-anchor="middle">alt LLM path</text><text class="tl" x="660" y="1002" text-anchor="middle">Tabs: red POD = a Pod you ship (a workload) · blue = the RHOAI platform feature/service · left column = external</text><text class="ts" x="660" y="1022" text-anchor="middle">① sense · Feast verdicts · ② reason · vLLM · ③ observe · MLflow · consult external think-tank · ④ plan co-decided (scorer + judge, one hard rail) · ⑤ actuate only through the gateway</text><text class="ts" x="660" y="1056" text-anchor="middle">Closed-Loop NetOps architecture</text></svg>