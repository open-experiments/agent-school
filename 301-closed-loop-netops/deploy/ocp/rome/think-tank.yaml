# The MCP think-tank — the loop's EXTERNAL reasoning service.
#
# The article keeps remediation-flow determination outside the agents'
# trust domain. On Rome that boundary is modeled as this separate
# namespace: no shared ServiceAccounts, no shared secrets, no state
# store access — agent-school's Planning agent knows only the MCP URL
# (http://think-tank.think-tank.svc.cluster.local:8080/mcp). On a real
# deployment this would live off-cluster entirely; the wire contract
# (MCP over streamable-HTTP) is identical either way, which is the
# point of the boundary. (Documented honestly: same cluster, separate
# trust domain.)
#
# Prereqs:
# - Its own LLM credentials (values identical to agent-school's on
#   Rome, but deliberately a separate secret — the trust domains do
#   not share objects):
#     oc create secret generic llm-credentials -n think-tank \
#       --from-literal=LLM_BASE_URL=http://kimi-linear-48b-a3b-predictor.telco-aix.svc.cluster.local:8080/v1 \
#       --from-literal=LLM_API_KEY=none \
#       --from-literal=LLM_MODEL=kimi-linear-48b-a3b
# - Source ConfigMap:
#     oc create configmap think-tank-src -n think-tank \
#       --from-file=server.py=../../../agents/thinktank/server.py
apiVersion: v1
kind: Namespace
metadata:
  name: think-tank
  labels:
    app.kubernetes.io/part-of: agent-school-external
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: think-tank
  namespace: think-tank
  labels:
    app: think-tank
spec:
  replicas: 1
  selector:
    matchLabels: {app: think-tank}
  template:
    metadata:
      labels: {app: think-tank}
    spec:
      volumes:
        - name: src
          configMap: {name: think-tank-src}
      containers:
        - name: mcp
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - >
              export HOME=/tmp PIP_NO_CACHE_DIR=1;
              pip install -q mcp==1.28.1 openai &&
              exec python3 /src/server.py
          envFrom:
            - secretRef: {name: llm-credentials}
          env:
            - {name: PORT, value: "8080"}
          ports:
            - {containerPort: 8080, name: mcp}
          startupProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: 8080}
            periodSeconds: 10
          volumeMounts:
            - {name: src, mountPath: /src}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: think-tank
  namespace: think-tank
  labels:
    app: think-tank
spec:
  selector: {app: think-tank}
  ports:
    - {name: mcp, port: 8080, targetPort: 8080}
