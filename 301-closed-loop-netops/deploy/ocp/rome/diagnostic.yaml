# Diagnostic agent — first worker of the 301 closed loop, live on Rome.
# LangGraph harness + A2A surface (a2a-sdk 0.3.22 pinned; the 1.x line
# reshuffles the server API), stock UBI9 Python with pip-at-startup —
# no custom image for Venice to mirror.
#
# Prereqs (all already live on Rome from 101/201/202):
# - feature-store-client + mlflow-tracking ConfigMaps, llm-credentials
#   Secret (101 rome kustomization)
# - the SA-group MLflow RoleBinding (101 mlflow-workspace-rbac.yaml)
# - loop-state store + loop-state-auth secret (state-store.yaml)
# - Source ConfigMap:
#     oc create configmap diagnostic-agent-src -n agent-school \
#       --from-file=agent.py=../../../agents/diagnostic/agent.py
apiVersion: v1
kind: ServiceAccount
metadata:
  name: diagnostic-agent
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: diagnostic-agent
  namespace: agent-school
  labels:
    app: diagnostic-agent
    app.kubernetes.io/part-of: agent-school
spec:
  replicas: 1
  selector:
    matchLabels: {app: diagnostic-agent}
  template:
    metadata:
      labels: {app: diagnostic-agent}
    spec:
      serviceAccountName: diagnostic-agent
      volumes:
        - name: src
          configMap: {name: diagnostic-agent-src}
      containers:
        - name: agent
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - >
              export HOME=/tmp PIP_NO_CACHE_DIR=1;
              pip install -q "a2a-sdk[http-server]==0.3.22" uvicorn httpx
              langgraph langchain langchain-openai mlflow==3.4.0 redis &&
              exec python3 /src/agent.py
          envFrom:
            - configMapRef: {name: mlflow-tracking}
            - configMapRef: {name: feature-store-client}
            - secretRef: {name: llm-credentials}
          env:
            - {name: MLFLOW_EXPERIMENT, value: 301-closed-loop}
            - name: STATE_PASSWORD
              valueFrom: {secretKeyRef: {name: loop-state-auth, key: password}}
            - name: STATE_STORE_URL
              value: redis://:$(STATE_PASSWORD)@loop-state.agent-school.svc.cluster.local:6379/0
          volumeMounts:
            - {name: src, mountPath: /src}
          ports:
            - {containerPort: 8080, name: a2a}
          startupProbe:
            httpGet: {path: /.well-known/agent.json, port: 8080}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /.well-known/agent.json, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: diagnostic-agent
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
spec:
  selector: {app: diagnostic-agent}
  ports:
    - {name: a2a, port: 8080, targetPort: 8080}
