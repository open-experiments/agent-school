# The loop's externalized workflow state store — Redis 7 (Red Hat rhel9
# image). Every agent in the Diagnostic -> Planning -> Execution ->
# Validation hierarchy reads/writes here and holds nothing locally:
# any worker can die and be replaced mid-loop (12-Factor Agent
# discipline the course teaches).
#
# Prereq secret (never committed):
#   oc create secret generic loop-state-auth -n agent-school \
#     --from-literal=password="$(openssl rand -hex 16)"
#
# Key conventions (stage 1):
#   loop:<id>:diagnostic  JSON record {loop_id, stage, telemetry, findings}
#   loop:<id>:status      diagnosed | planned | executed | validated
#   loop:index            LPUSH'd loop ids, newest first
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loop-state
  namespace: agent-school
  labels:
    app: loop-state
    app.kubernetes.io/part-of: agent-school
spec:
  replicas: 1
  selector:
    matchLabels: {app: loop-state}
  template:
    metadata:
      labels: {app: loop-state}
    spec:
      containers:
        - name: redis
          image: registry.redhat.io/rhel9/redis-7:latest
          env:
            - name: REDIS_PASSWORD
              valueFrom: {secretKeyRef: {name: loop-state-auth, key: password}}
          ports:
            - {containerPort: 6379, name: redis}
          readinessProbe:
            tcpSocket: {port: 6379}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: loop-state
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
spec:
  selector: {app: loop-state}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
