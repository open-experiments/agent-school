# One-shot: A2A smoke test against the live Diagnostic agent — resolves
# the agent card, sends message/send, prints findings, then reads the
# externalized state back from the loop store (the 12-Factor proof).
# See ../../../agents/diagnostic/smoke_client.py.
#
# Prereq ConfigMap:
#   oc create configmap diagnostic-smoke-src -n agent-school \
#     --from-file=smoke_client.py=../../../agents/diagnostic/smoke_client.py
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-diagnostic
  namespace: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: src
          configMap: {name: diagnostic-smoke-src}
      containers:
        - name: smoke
          image: registry.access.redhat.com/ubi9/python-311:latest
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
            - name: STATE_PASSWORD
              valueFrom: {secretKeyRef: {name: loop-state-auth, key: password}}
            - name: STATE_STORE_URL
              value: redis://:$(STATE_PASSWORD)@loop-state.agent-school.svc.cluster.local:6379/0
          command:
            - /bin/sh
            - -c
            - >
              pip install -q "a2a-sdk==0.3.22" httpx redis &&
              python3 /src/smoke_client.py
          volumeMounts:
            - {name: src, mountPath: /src}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
      # (agent source is mounted in the agent Deployment, not here)
