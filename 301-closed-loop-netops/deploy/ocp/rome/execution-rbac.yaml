# Governance for the loop's most dangerous component.
#
# An agent that can run playbooks is where scrutiny concentrates, so
# Execution's ServiceAccount gets exactly one capability: deployments
# (and their scale) in the fiveg-core namespace. Not cluster-admin,
# not namespace edit, no secrets, no pod exec, nothing in agent-school
# beyond what every pod has. The SA-group MLflow binding (101's
# mlflow-workspace-rbac.yaml) covers its tracking writes; this file is
# the entire actuation surface.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: execution-agent
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: nf-actuator
  namespace: fiveg-core
  labels:
    app.kubernetes.io/part-of: agent-school
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: execution-agent-nf-actuator
  namespace: fiveg-core
  labels:
    app.kubernetes.io/part-of: agent-school
subjects:
  - kind: ServiceAccount
    name: execution-agent
    namespace: agent-school
roleRef:
  kind: Role
  name: nf-actuator
  apiGroup: rbac.authorization.k8s.io
