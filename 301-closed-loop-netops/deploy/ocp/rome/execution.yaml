# Execution agent — governed actuation arm of the 301 loop.
# No LLM in this pod (deliberate: the most dangerous component gets no
# creativity). As of Track 4 it holds NO fiveg-core RBAC and runs NO
# Ansible: it actuates by calling the MCP playbook server over the
# Kuadrant gateway (mcp-playbook.yaml, netops-gateway.yaml,
# mcp-gateway-policies.yaml), presenting its own SA token. So this pod
# only needs the MCP client — no ansible-core, no kubernetes.core, no
# playbook ConfigMap.
#
# Prereqs: fiveg-core.yaml, execution-rbac.yaml (SA + Role only; the
# execution-agent->nf-actuator binding is intentionally removed),
# netops-gateway.yaml, mcp-playbook.yaml, mcp-gateway-policies.yaml,
# state store, plus:
#   oc create configmap execution-agent-src -n agent-school \
#     --from-file=agent.py=../../../agents/execution/agent.py
apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-agent
  namespace: agent-school
  labels:
    app: execution-agent
    app.kubernetes.io/part-of: agent-school
spec:
  replicas: 1
  selector:
    matchLabels: {app: execution-agent}
  template:
    metadata:
      labels: {app: execution-agent}
    spec:
      serviceAccountName: execution-agent
      volumes:
        - name: src
          configMap: {name: execution-agent-src}
      containers:
        - name: agent
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - >
              export HOME=/tmp PIP_NO_CACHE_DIR=1;
              pip install -q "a2a-sdk[http-server]==0.3.22" uvicorn httpx
              mlflow==3.4.0 redis "mcp==1.28.1" &&
              exec python3 /src/agent.py
          envFrom:
            - configMapRef: {name: mlflow-tracking}
          env:
            - {name: MLFLOW_EXPERIMENT, value: 301-closed-loop}
            - name: GATEWAY_URL
              value: http://netops-gateway-data-science-gateway-class.agent-school.svc.cluster.local:8080/mcp
            - name: STATE_PASSWORD
              valueFrom: {secretKeyRef: {name: loop-state-auth, key: password}}
            - name: STATE_STORE_URL
              value: redis://:$(STATE_PASSWORD)@loop-state.agent-school.svc.cluster.local:6379/0
          volumeMounts:
            - {name: src, mountPath: /src}
          ports:
            - {containerPort: 8080, name: a2a}
          startupProbe:
            httpGet: {path: /.well-known/agent.json, port: 8080}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /.well-known/agent.json, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: execution-agent
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
spec:
  selector: {app: execution-agent}
  ports:
    - {name: a2a, port: 8080, targetPort: 8080}
