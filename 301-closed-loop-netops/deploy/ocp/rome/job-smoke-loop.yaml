# One-shot: the full loop, Diagnostic -> Planning -> gate -> Execution,
# on one loop id — including the negative test (execute WITHOUT
# approval must be refused) before the approved actuation runs the
# real playbooks against fiveg-core.
# See ../../../agents/execution/smoke_loop.py.
#
# Prereq ConfigMap:
#   oc create configmap loop-smoke-src -n agent-school \
#     --from-file=smoke_loop.py=../../../agents/execution/smoke_loop.py
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-loop
  namespace: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: src
          configMap: {name: loop-smoke-src}
      containers:
        - name: smoke
          image: registry.access.redhat.com/ubi9/python-311:latest
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
            - name: STATE_PASSWORD
              valueFrom: {secretKeyRef: {name: loop-state-auth, key: password}}
            - name: STATE_STORE_URL
              value: redis://:$(STATE_PASSWORD)@loop-state.agent-school.svc.cluster.local:6379/0
          command:
            - /bin/sh
            - -c
            - >
              pip install -q "a2a-sdk==0.3.22" httpx redis &&
              python3 /src/smoke_loop.py
          volumeMounts:
            - {name: src, mountPath: /src}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
