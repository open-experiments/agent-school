# One-shot: Diagnostic -> Planning chain over A2A, one loop id — the
# loop's first two stages driven end to end, MCP think-tank consulted
# across the namespace boundary, state advancing diagnosed -> planned.
# See ../../../agents/planning/smoke_chain.py.
#
# Prereq ConfigMap:
#   oc create configmap chain-smoke-src -n agent-school \
#     --from-file=smoke_chain.py=../../../agents/planning/smoke_chain.py
apiVersion: batch/v1
kind: Job
metadata:
  name: smoke-chain
  namespace: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: src
          configMap: {name: chain-smoke-src}
      containers:
        - name: smoke
          image: registry.access.redhat.com/ubi9/python-311:latest
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
            - name: STATE_PASSWORD
              valueFrom: {secretKeyRef: {name: loop-state-auth, key: password}}
            - name: STATE_STORE_URL
              value: redis://:$(STATE_PASSWORD)@loop-state.agent-school.svc.cluster.local:6379/0
          command:
            - /bin/sh
            - -c
            - >
              pip install -q "a2a-sdk==0.3.22" httpx redis &&
              python3 /src/smoke_chain.py
          volumeMounts:
            - {name: src, mountPath: /src}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
