<svg viewBox="0 0 1320 900" width="1320" height="900" xmlns="http://www.w3.org/2000/svg">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: #2a2a2a; }
.ts { font-size: 12px; font-weight: 400; fill: #5f5f5f; }
.tz { font-size: 13px; font-weight: 600; fill: #6b6b6b; letter-spacing: .4px; }
.tl { font-size: 11.5px; font-weight: 600; fill: #6b6b6b; }
.c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1.25; }
.c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
.c-teal rect { fill: #E0F4F2; stroke: #0E7569; stroke-width: 1.25; }
.c-teal .th { fill: #084D45; } .c-teal .ts { fill: #0E7569; }
.c-amber rect { fill: #FCF2DF; stroke: #9A6700; stroke-width: 1.25; }
.c-amber .th { fill: #6B4A00; } .c-amber .ts { fill: #9A6700; }
.c-green rect { fill: #E5F4E5; stroke: #1F7A33; stroke-width: 1.25; }
.c-green .th { fill: #114D1F; } .c-green .ts { fill: #1F7A33; }
.c-gray rect { fill: #F2F2F1; stroke: #8a8a8a; stroke-width: 1.25; }
.c-gray .th { fill: #3A3A3A; } .c-gray .ts { fill: #6B6B6B; }
.c-agent rect { fill: #FDF1F1; stroke: #C0392B; stroke-width: 2.5; }
.agent-t { font-size: 21px; font-weight: 800; fill: #7A1C12; }
.agent-flow { font-size: 15px; font-weight: 700; fill: #7A1C12; }
.arrow { stroke: #8a8a8a; stroke-width: 1.6; fill: none; }
.arrow-h { stroke: #C0392B; stroke-width: 1.8; fill: none; }
.dashed { stroke-dasharray: 5 4; }
.tab-rhoai rect { fill:#EAF2FB; stroke:#185FA5; stroke-width:1; }
.tab-rhoai text { fill:#0C447C; font-size:11px; font-weight:700; }
.tab-pod rect { fill:#C0392B; }
.tab-pod text { fill:#ffffff; font-size:12px; font-weight:800; letter-spacing:.5px; }
</style>
<defs>
<marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8a8a8a"/></marker>
<marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#C0392B"/></marker>
</defs>
<rect width="1320" height="900" fill="#ffffff"/>

<!-- Zones -->
<rect x="20" y="44" width="250" height="812" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text class="tz" x="36" y="70">EXTERNAL</text>
<rect x="300" y="44" width="995" height="812" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text class="tz" x="316" y="70">OPENSHIFT SNO "ROME" · RED HAT OPENSHIFT AI 3.5</text>

<!-- External -->
<g class="c-gray">
<rect x="35" y="100" width="220" height="125" rx="8"/>
<text class="th" x="145" y="128" text-anchor="middle">Published models</text>
<text class="ts" x="145" y="150" text-anchor="middle">hf.co/fenar/sustainability</text>
<text class="ts" x="145" y="168" text-anchor="middle">+ airan-energy JAX DQN</text>
<text class="ts" x="145" y="186" text-anchor="middle">(Telco-AIX)</text>
</g>
<g class="c-gray">
<rect x="35" y="395" width="220" height="120" rx="8"/>
<text class="th" x="145" y="423" text-anchor="middle">RAN operations</text>
<text class="ts" x="145" y="445" text-anchor="middle">consumes the change-plan;</text>
<text class="ts" x="145" y="463" text-anchor="middle">the agent never</text>
<text class="ts" x="145" y="481" text-anchor="middle">touches the RAN</text>
</g>
<g class="c-green">
<rect x="35" y="700" width="220" height="115" rx="8"/>
<text class="th" x="145" y="728" text-anchor="middle">RHOAI MaaS</text>
<text class="ts" x="145" y="750" text-anchor="middle">LiteLLM gateway ·</text>
<text class="ts" x="145" y="768" text-anchor="middle">alt model path</text>
</g>

<!-- Top band: develop / serve / observe -->
<g class="c-amber">
<rect x="330" y="100" width="255" height="185" rx="8"/>
<text class="th" x="457" y="130" text-anchor="middle">JAX DQN simulation (Job)</text>
<text class="ts" x="457" y="156" text-anchor="middle">pattern 3 · Kueue batch Job</text>
<text class="ts" x="457" y="174" text-anchor="middle">via the K8s Job API,</text>
<text class="ts" x="457" y="192" text-anchor="middle">scoped RBAC</text>
<text class="ts" x="457" y="220" text-anchor="middle">airan-energy cell-sleep</text>
<text class="ts" x="457" y="238" text-anchor="middle">optimization · GPU work</text>
<text class="ts" x="457" y="256" text-anchor="middle">never runs in the agent pod</text>
</g>
<g class="c-green">
<rect x="620" y="100" width="270" height="185" rx="8"/>
<text class="th" x="755" y="130" text-anchor="middle">Sustainability scorer · KServe</text>
<text class="ts" x="755" y="156" text-anchor="middle">pattern 2 · energy-efficiency</text>
<text class="ts" x="755" y="174" text-anchor="middle">prediction model, served</text>
<text class="ts" x="755" y="202" text-anchor="middle">the calibrated QUANT signal ·</text>
<text class="ts" x="755" y="220" text-anchor="middle">reached only through the</text>
<text class="ts" x="755" y="238" text-anchor="middle">governed /score gateway below</text>
</g>
<g class="c-blue">
<rect x="925" y="100" width="350" height="185" rx="8"/>
<text class="th" x="1100" y="130" text-anchor="middle">MLflow · workspace agent-school</text>
<text class="ts" x="1100" y="156" text-anchor="middle">every proposal · simulation ·</text>
<text class="ts" x="1100" y="174" text-anchor="middle">score · decision recorded</text>
<text class="ts" x="1100" y="202" text-anchor="middle">rejected proposals kept too,</text>
<text class="ts" x="1100" y="220" text-anchor="middle">the audit is the loop's memory</text>
<text class="ts" x="1100" y="248" text-anchor="middle">+ GenAI eval suite measures the</text>
<text class="ts" x="1100" y="266" text-anchor="middle">judge (dataset · scorers · run)</text>
</g>

<!-- Governance gateway between scorer and agent -->
<g class="c-amber">
<rect x="625" y="320" width="260" height="56" rx="8"/>
<text class="th" x="755" y="344" text-anchor="middle">Kuadrant /score gateway</text>
<text class="ts" x="755" y="362" text-anchor="middle">AuthPolicy (optimizer + judge) · rate cap</text>
</g>

<!-- CENTER: the agent -->
<g class="c-agent">
<rect x="545" y="430" width="420" height="180" rx="12"/>
<text class="agent-t" x="755" y="470" text-anchor="middle">Energy-optimizer agent</text>
<text class="ts" x="755" y="494" text-anchor="middle">OGX loop · CPU-only · UBI9 · restricted PSS</text>
<text class="agent-flow" x="755" y="536" text-anchor="middle">propose → simulate → score → co-decide → emit</text>
<text class="ts" x="755" y="566" text-anchor="middle">simulate-before-act · the only output is a</text>
<text class="ts" x="755" y="584" text-anchor="middle">change-plan artifact, never a network change</text>
</g>

<!-- Right: co-decision partner + reasoning -->
<g class="c-teal">
<rect x="1010" y="430" width="270" height="135" rx="8"/>
<text class="th" x="1145" y="458" text-anchor="middle">GenAI Judge (OGX · A2A)</text>
<text class="ts" x="1145" y="482" text-anchor="middle">the QUAL half · grounds on the</text>
<text class="ts" x="1145" y="500" text-anchor="middle">SAME governed /score, then a</text>
<text class="ts" x="1145" y="518" text-anchor="middle">verdict: accept / revise / reject ·</text>
<text class="ts" x="1145" y="536" text-anchor="middle">arbiter adds one hard QoS rail</text>
</g>
<g class="c-green">
<rect x="1010" y="600" width="270" height="130" rx="8"/>
<text class="th" x="1145" y="628" text-anchor="middle">vLLM on RHOAI (KServe)</text>
<text class="ts" x="1145" y="652" text-anchor="middle">Kimi-Linear-48B-A3B</text>
<text class="ts" x="1145" y="670" text-anchor="middle">reasoning for propose / revise</text>
<text class="ts" x="1145" y="688" text-anchor="middle">OpenAI-compatible /v1 ·</text>
<text class="ts" x="1145" y="706" text-anchor="middle">stateless, swappable</text>
</g>

<!-- Spokes from the agent (numbered) -->
<!-- 1 dispatch to sim Job -->
<polyline class="arrow-h" points="600,430 600,300 500,300 500,287" marker-end="url(#ah)"/>
<text class="tl" x="612" y="322" text-anchor="middle">①</text>
<!-- 2 score via gateway to scorer -->
<polyline class="arrow-h" points="735,430 735,378" marker-end="url(#ah)"/>
<text class="tl" x="720" y="404" text-anchor="middle">②</text>
<line class="arrow" x1="755" y1="320" x2="755" y2="287" marker-end="url(#a)"/>
<!-- 3 audit + eval to MLflow -->
<polyline class="arrow-h" points="945,435 945,300 1015,300 1015,287" marker-end="url(#ah)"/>
<text class="tl" x="962" y="322" text-anchor="middle">③</text>
<!-- 4 co-decide with judge -->
<line class="arrow-h" x1="965" y1="480" x2="1006" y2="480" marker-end="url(#ah)"/>
<text class="tl" x="988" y="472" text-anchor="middle">④</text>
<!-- judge grounds on the same governed score -->
<polyline class="arrow dashed" points="1075,430 1075,348 889,348" marker-end="url(#a)"/>
<text class="tl" x="965" y="342" text-anchor="middle">grounds</text>
<!-- 5 reason via vLLM -->
<polyline class="arrow-h" points="965,575 988,575 988,650 1006,650" marker-end="url(#ah)"/>
<text class="tl" x="978" y="595" text-anchor="middle">⑤</text>
<!-- 6 emit change-plan out to RAN ops -->
<polyline class="arrow-h" points="545,500 300,500 258,478" marker-end="url(#ah)"/>
<text class="tl" x="405" y="492" text-anchor="middle">⑥ emit change-plan</text>
<!-- package models in -->
<line class="arrow" x1="255" y1="150" x2="326" y2="180" marker-end="url(#a)"/>
<text class="tl" x="292" y="146" text-anchor="middle">package</text>
<!-- alt LLM path -->
<polyline class="arrow dashed" points="145,700 145,548 541,548" marker-end="url(#a)"/>
<text class="tl" x="330" y="542" text-anchor="middle">alt LLM path · same OpenAI contract</text>

<!-- Legend -->
<text class="tl" x="660" y="812" text-anchor="middle">Tabs: red POD = a Pod you ship (a workload) · blue = the RHOAI platform feature/service · left column = external</text>
<text class="ts" x="660" y="836" text-anchor="middle">① dispatch sim (Job) · ② score (governed, quant) · ③ audit + GenAI eval · ④ co-decide with the judge (qual) · ⑤ reason · ⑥ emit</text>
<!-- type tabs: POD = a workload you ship · RHOAI = a platform feature/service -->
<g class="tab-rhoai"><rect x="348" y="90" width="90" height="20" rx="6"/><text x="393" y="104" text-anchor="middle">RHOAI · Kueue</text></g>
<g class="tab-rhoai"><rect x="638" y="90" width="94" height="20" rx="6"/><text x="685" y="104" text-anchor="middle">RHOAI · KServe</text></g>
<g class="tab-rhoai"><rect x="943" y="90" width="94" height="20" rx="6"/><text x="990" y="104" text-anchor="middle">RHOAI · MLflow</text></g>
<g class="tab-rhoai"><rect x="643" y="310" width="102" height="20" rx="6"/><text x="694" y="324" text-anchor="middle">RHOAI · Kuadrant</text></g>
<g class="tab-rhoai"><rect x="1028" y="590" width="94" height="20" rx="6"/><text x="1075" y="604" text-anchor="middle">RHOAI · KServe</text></g>
<g class="tab-pod"><rect x="560" y="418" width="64" height="23" rx="6"/><text x="592" y="434" text-anchor="middle">POD</text></g>
<g class="tab-pod"><rect x="1024" y="418" width="64" height="23" rx="6"/><text x="1056" y="434" text-anchor="middle">POD</text></g>
<g class="tab-rhoai"><rect x="1028" y="555" width="152" height="20" rx="6"/><text x="1104" y="569" text-anchor="middle">RHOAI · Model Serving</text></g>
</svg>
