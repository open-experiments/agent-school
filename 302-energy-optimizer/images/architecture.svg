<svg viewBox="0 0 1180 790" width="1180" height="790" xmlns="http://www.w3.org/2000/svg">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: #2a2a2a; }
.ts { font-size: 12px; font-weight: 400; fill: #5f5f5f; }
.tz { font-size: 13px; font-weight: 600; fill: #6b6b6b; letter-spacing: .4px; }
.tl { font-size: 11.5px; font-weight: 500; fill: #6b6b6b; }
.c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1.25; }
.c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
.c-teal rect { fill: #E0F4F2; stroke: #0E7569; stroke-width: 1.25; }
.c-teal .th { fill: #084D45; } .c-teal .ts { fill: #0E7569; }
.c-amber rect { fill: #FCF2DF; stroke: #9A6700; stroke-width: 1.25; }
.c-amber .th { fill: #6B4A00; } .c-amber .ts { fill: #9A6700; }
.c-green rect { fill: #E5F4E5; stroke: #1F7A33; stroke-width: 1.25; }
.c-green .th { fill: #114D1F; } .c-green .ts { fill: #1F7A33; }
.c-gray rect { fill: #F2F2F1; stroke: #8a8a8a; stroke-width: 1.25; }
.c-gray .th { fill: #3A3A3A; } .c-gray .ts { fill: #6B6B6B; }
.arrow { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
.dashed { stroke-dasharray: 5 4; }
</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8a8a8a"/></marker></defs>
<rect width="1180" height="790" fill="#ffffff"/>

<!-- Zone: External -->
<rect x="15" y="30" width="210" height="690" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text class="tz" x="30" y="56">EXTERNAL</text>

<g class="c-gray">
<rect x="30" y="100" width="175" height="120" rx="8"/>
<text class="th" x="117" y="130" text-anchor="middle">Published models</text>
<text class="ts" x="117" y="152" text-anchor="middle">hf.co/fenar/sustainability</text>
<text class="ts" x="117" y="170" text-anchor="middle">+ airan-energy JAX DQN</text>
<text class="ts" x="117" y="188" text-anchor="middle">(Telco-AIX)</text>
</g>

<g class="c-gray">
<rect x="30" y="260" width="175" height="120" rx="8"/>
<text class="th" x="117" y="290" text-anchor="middle">RAN operations</text>
<text class="ts" x="117" y="312" text-anchor="middle">consumes the change-plan</text>
<text class="ts" x="117" y="330" text-anchor="middle">artifact · the agent</text>
<text class="ts" x="117" y="348" text-anchor="middle">never touches the RAN</text>
</g>

<g class="c-green">
<rect x="30" y="560" width="175" height="110" rx="8"/>
<text class="th" x="117" y="590" text-anchor="middle">RHOAI MaaS</text>
<text class="ts" x="117" y="612" text-anchor="middle">LiteLLM gateway ·</text>
<text class="ts" x="117" y="630" text-anchor="middle">alt model path</text>
</g>

<!-- Zone: Cluster -->
<rect x="250" y="30" width="910" height="690" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text class="tz" x="266" y="56">OPENSHIFT SNO "ROME" · RED HAT OPENSHIFT AI 3.5</text>

<!-- Batch sim -->
<g class="c-amber">
<rect x="280" y="90" width="250" height="240" rx="8"/>
<text class="th" x="405" y="118" text-anchor="middle">JAX DQN simulation (Job)</text>
<text class="ts" x="405" y="146" text-anchor="middle">pattern 3: batch dispatch via</text>
<text class="ts" x="405" y="164" text-anchor="middle">the K8s Job API, scoped RBAC</text>
<text class="ts" x="405" y="192" text-anchor="middle">airan-energy cell-sleep</text>
<text class="ts" x="405" y="210" text-anchor="middle">optimization (30–35% savings</text>
<text class="ts" x="405" y="228" text-anchor="middle">in the source experiment)</text>
<text class="ts" x="405" y="256" text-anchor="middle">GPU work never runs</text>
<text class="ts" x="405" y="274" text-anchor="middle">in the agent pod</text>
</g>

<!-- Scorer -->
<g class="c-green">
<rect x="560" y="90" width="260" height="240" rx="8"/>
<text class="th" x="690" y="118" text-anchor="middle">Sustainability scorer</text>
<text class="th" x="690" y="136" text-anchor="middle">on KServe</text>
<text class="ts" x="690" y="164" text-anchor="middle">pattern 2: energy-efficiency</text>
<text class="ts" x="690" y="182" text-anchor="middle">prediction model, served</text>
<text class="ts" x="690" y="210" text-anchor="middle">every simulated plan gets an</text>
<text class="ts" x="690" y="228" text-anchor="middle">independent score before the</text>
<text class="ts" x="690" y="246" text-anchor="middle">agent may emit it</text>
<text class="ts" x="690" y="274" text-anchor="middle">reached ONLY via the Kuadrant</text>
<text class="ts" x="690" y="292" text-anchor="middle">/score gateway (AuthN + rate cap)</text>
</g>

<!-- MLflow -->
<g class="c-blue">
<rect x="850" y="90" width="280" height="240" rx="8"/>
<text class="th" x="990" y="118" text-anchor="middle">MLflow · workspace agent-school</text>
<text class="ts" x="990" y="146" text-anchor="middle">every proposal · simulation ·</text>
<text class="ts" x="990" y="164" text-anchor="middle">score · decision recorded</text>
<text class="ts" x="990" y="192" text-anchor="middle">rejected proposals kept too,</text>
<text class="ts" x="990" y="210" text-anchor="middle">the audit is the loop's memory</text>
<text class="ts" x="990" y="238" text-anchor="middle">Develop &amp; train → Experiments</text>
<text class="ts" x="990" y="266" text-anchor="middle">+ GenAI eval suite measures the</text>
<text class="ts" x="990" y="284" text-anchor="middle">judge (dataset · scorers · run)</text>
</g>

<!-- Agent pod -->
<g class="c-gray">
<rect x="280" y="400" width="530" height="300" rx="8"/>
<text class="th" x="296" y="426">Energy-optimizer agent pod · OGX loop (CPU-only)</text>
</g>
<g class="c-teal">
<rect x="300" y="440" width="230" height="100" rx="8"/>
<text class="th" x="415" y="466" text-anchor="middle">propose</text>
<text class="ts" x="415" y="488" text-anchor="middle">candidate cell-sleep windows</text>
<text class="ts" x="415" y="506" text-anchor="middle">from traffic forecasts</text>
</g>
<g class="c-amber">
<rect x="560" y="440" width="230" height="100" rx="8"/>
<text class="th" x="675" y="466" text-anchor="middle">simulate (dispatch)</text>
<text class="ts" x="675" y="488" text-anchor="middle">submit batch Job · poll results</text>
<text class="ts" x="675" y="506" text-anchor="middle">RBAC-scoped ServiceAccount</text>
</g>
<g class="c-teal">
<rect x="300" y="580" width="230" height="100" rx="8"/>
<text class="th" x="415" y="602" text-anchor="middle">score · quant</text>
<text class="ts" x="415" y="624" text-anchor="middle">governed /score → calibrated</text>
<text class="ts" x="415" y="642" text-anchor="middle">risk signal (energy · QoS)</text>
</g>
<g class="c-amber">
<rect x="560" y="580" width="230" height="100" rx="8"/>
<text class="th" x="675" y="600" text-anchor="middle">co-decide · arbiter</text>
<text class="ts" x="675" y="620" text-anchor="middle">quant gate + GenAI judge</text>
<text class="ts" x="675" y="638" text-anchor="middle">+ hard QoS rail (non-negotiable)</text>
<text class="ts" x="675" y="656" text-anchor="middle">every override audited</text>
</g>

<!-- vLLM -->
<g class="c-green">
<rect x="850" y="440" width="280" height="150" rx="8"/>
<text class="th" x="990" y="470" text-anchor="middle">vLLM on RHOAI (KServe)</text>
<text class="ts" x="990" y="494" text-anchor="middle">reasoning for propose / revise</text>
<text class="ts" x="990" y="514" text-anchor="middle">OpenAI-compatible /v1 ·</text>
<text class="ts" x="990" y="532" text-anchor="middle">stateless, swappable</text>
</g>

<!-- GenAI Judge -->
<g class="c-teal">
<rect x="850" y="610" width="280" height="110" rx="8"/>
<text class="th" x="990" y="636" text-anchor="middle">GenAI Judge (OGX · A2A)</text>
<text class="ts" x="990" y="660" text-anchor="middle">grounds on the SAME governed</text>
<text class="ts" x="990" y="678" text-anchor="middle">/score, then renders a verdict:</text>
<text class="ts" x="990" y="696" text-anchor="middle">accept · revise · reject</text>
</g>

<!-- Arrows -->
<line class="arrow" x1="205" y1="150" x2="274" y2="150" marker-end="url(#a)"/>
<text class="tl" x="240" y="140" text-anchor="middle">①</text>
<text class="tl" x="240" y="176" text-anchor="middle">package</text>

<polyline class="arrow" points="415,440 415,372 990,372 990,436" marker-end="url(#a)"/>
<text class="tl" x="852" y="366" text-anchor="middle">② reason · revise loop</text>

<polyline class="arrow" points="675,440 675,388 405,388 405,336" marker-end="url(#a)"/>
<text class="tl" x="540" y="382" text-anchor="middle">③ submit · poll (pattern 3)</text>

<polyline class="arrow" points="530,614 545,614 545,368 690,368 690,336" marker-end="url(#a)"/>
<text class="tl" x="614" y="362" text-anchor="middle">④ score the plan</text>

<polyline class="arrow" points="790,630 830,630 830,354 925,354 925,336" marker-end="url(#a)"/>
<text class="tl" x="884" y="348" text-anchor="middle">⑤ evidence trail</text>

<polyline class="arrow" points="620,680 620,712 240,712 240,384 209,384" marker-end="url(#a)"/>
<text class="tl" x="430" y="706" text-anchor="middle">⑥ change-plan artifact (simulation + score attached)</text>

<line class="arrow" x1="530" y1="490" x2="556" y2="490" marker-end="url(#a)"/>
<text class="tl" x="543" y="481" text-anchor="middle">then</text>
<polyline class="arrow" points="330,540 330,576" marker-end="url(#a)"/>
<line class="arrow" x1="530" y1="648" x2="556" y2="648" marker-end="url(#a)"/>
<polyline class="arrow dashed" points="675,580 675,552 340,552 340,544" marker-end="url(#a)"/>
<text class="tl" x="508" y="547" text-anchor="middle">revise</text>

<polyline class="arrow dashed" points="675,700 675,745 117,745 117,674" marker-end="url(#a)"/>
<text class="tl" x="400" y="738" text-anchor="middle">alt LLM path · same OpenAI-compatible contract</text>

<line class="arrow" x1="848" y1="655" x2="792" y2="650" marker-end="url(#a)"/>
<text class="tl" x="820" y="642" text-anchor="middle">verdict</text>
<polyline class="arrow dashed" points="848,692 833,692 833,358 745,358 745,332" marker-end="url(#a)"/>
<text class="tl" x="742" y="350" text-anchor="middle">grounds</text>

<text class="ts" x="590" y="778" text-anchor="middle">STATUS: LIVE ON ROME · propose → simulate (Job) → score (governed, quant) → GenAI judge (A2A, qual) → arbiter co-decides (hard QoS rail, overrides audited) → emit</text>
</svg>
