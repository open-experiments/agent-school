# One optimization episode: propose (OGX / Llama Stack Agents API) ->
# dispatch sim Job (pattern 3, Kueue) -> score on the served model via
# the Kuadrant-governed scorer MCP tool (pattern 2, governed) ->
# quant+qual co-decision (classic threshold gate + GenAI judge over A2A,
# hard QoS rail, audited overrides) -> change-plan artifact in MLflow
# (rejections logged too). The agent's ONLY output is the artifact — it
# never touches a network.
# See ../../../agent/energy_optimizer.py.
#
# Prereq ConfigMap:
#   oc create configmap optimizer-src -n agent-school \
#     --from-file=energy_optimizer.py=../../../agent/energy_optimizer.py
apiVersion: batch/v1
kind: Job
metadata:
  name: optimize-episode
  namespace: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 3000
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: energy-optimizer
      volumes:
        - name: src
          configMap: {name: optimizer-src}
      containers:
        - name: optimizer
          image: registry.access.redhat.com/ubi9/python-311:latest
          envFrom:
            - configMapRef: {name: mlflow-tracking}
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
            - {name: MLFLOW_EXPERIMENT, value: 302-energy-optimizer}
            - {name: MIN_SAVINGS_PCT, value: "3.0"}
            - {name: MAX_QOS_DROP_PCT, value: "0.5"}
            - {name: MIN_EFFICIENCY, value: "60.0"}
            - {name: MAX_ROUNDS, value: "3"}
            - {name: HARD_QOS_FLOOR_PCT, value: "2.0"}
          command:
            - /bin/sh
            - -c
            - >
              pip install -q llama-stack-client==0.2.12 fire termcolor
              kubernetes mlflow==3.4.0 "mcp==1.28.1"
              "a2a-sdk==0.3.22" httpx &&
              python3 /src/energy_optimizer.py
          volumeMounts:
            - {name: src, mountPath: /src}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
