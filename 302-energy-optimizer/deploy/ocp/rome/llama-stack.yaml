# Llama Stack server for 302 — the harness runtime.
#
# EA2 state: the DataScienceCluster runs llamastackoperator Removed,
# so the stack runs as a plain Deployment (documented honestly; swap
# to the operator's LlamaStackDistribution CR when it graduates).
# Inference provider is remote::vllm -> the cluster's Kimi-Linear
# endpoint. Version pinned to 0.2.12; the extra pip packages are the
# deps discovered by booting 0.2.12 from a bare venv.
#
# Prereq ConfigMap:
#   oc create configmap llama-stack-config -n agent-school \
#     --from-file=run.yaml=../../../agent/run.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-stack
  namespace: agent-school
  labels:
    app: llama-stack
    app.kubernetes.io/part-of: agent-school
spec:
  replicas: 1
  selector:
    matchLabels: {app: llama-stack}
  template:
    metadata:
      labels: {app: llama-stack}
    spec:
      # K8s service-link env injection collides with llama-stack's own
      # env config: the Service named llama-stack yields
      # LLAMA_STACK_PORT=tcp://<ip>:8321, which the server tries to
      # int() as its port and crashes (found live on Rome).
      enableServiceLinks: false
      volumes:
        - name: config
          configMap: {name: llama-stack-config}
      containers:
        - name: server
          image: registry.access.redhat.com/ubi9/python-311:latest
          command:
            - /bin/sh
            - -c
            - >
              export HOME=/tmp PIP_NO_CACHE_DIR=1;
              pip install -q llama-stack==0.2.12
              llama-stack-client==0.2.12 opentelemetry-sdk
              opentelemetry-exporter-otlp-proto-http aiosqlite
              faiss-cpu autoevals sqlalchemy mcp &&
              exec llama stack run /config/run.yaml
          env:
            - {name: VLLM_URL,
               value: "http://kimi-linear-48b-a3b-predictor.telco-aix.svc.cluster.local:8080/v1"}
          ports:
            - {containerPort: 8321, name: http}
          startupProbe:
            httpGet: {path: /v1/health, port: 8321}
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /v1/health, port: 8321}
            periodSeconds: 10
          volumeMounts:
            - {name: config, mountPath: /config}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "1", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
apiVersion: v1
kind: Service
metadata:
  name: llama-stack
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
spec:
  selector: {app: llama-stack}
  ports:
    - {name: http, port: 8321, targetPort: 8321}
