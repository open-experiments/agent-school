# One-shot: train + register the sustainability scorer from the
# published Telco-AIX dataset (100K rows). Faithful reproduction of
# the source notebook's recipe; registers
# `sustainability-energy-efficiency` v1 in the workspace MLflow.
# See ../../../training/train_sustainability.py.
#
# Prereq ConfigMap:
#   oc create configmap sustain-train-src -n agent-school \
#     --from-file=train.py=../../../training/train_sustainability.py
apiVersion: batch/v1
kind: Job
metadata:
  name: train-sustainability
  namespace: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 1200
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: src
          configMap: {name: sustain-train-src}
      containers:
        - name: train
          image: registry.access.redhat.com/ubi9/python-311:latest
          envFrom:
            - configMapRef: {name: mlflow-tracking}
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
          command:
            - /bin/sh
            - -c
            - >
              pip install -q mlflow==3.4.0 scikit-learn==1.5.2
              pandas==2.2.3 joblib &&
              python3 /src/train.py
          volumeMounts:
            - {name: src, mountPath: /src}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
---
# Stage the registered version to MinIO for KServe (bridge job).
# Prereq ConfigMap:
#   oc create configmap sustain-stage-src -n agent-school \
#     --from-file=stage_model.py=../../../serving/stage_model.py
apiVersion: batch/v1
kind: Job
metadata:
  name: stage-sustainability
  namespace: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: src
          configMap: {name: sustain-stage-src}
      containers:
        - name: stage
          image: registry.access.redhat.com/ubi9/python-311:latest
          envFrom:
            - configMapRef: {name: mlflow-tracking}
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
            - {name: MODEL_NAME, value: sustainability-energy-efficiency}
            - {name: MODEL_VERSION, value: "1"}
            - name: AK
              valueFrom: {secretKeyRef: {name: dspa-minio-creds, key: accesskey}}
            - name: SK
              valueFrom: {secretKeyRef: {name: dspa-minio-creds, key: secretkey}}
          command:
            - /bin/sh
            - -c
            - >
              pip install -q mlflow==3.4.0 boto3 &&
              python3 /src/stage_model.py
          volumeMounts:
            - {name: src, mountPath: /src}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
