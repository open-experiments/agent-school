# The simulation Job the 302 agent submits (pattern 3) — one Job per
# proposal, admitted through Kueue (queue-name label -> shared
# ClusterQueue -> Workload metrics), JAX on CPU. The agent creates
# Jobs from this shape via the K8s API under sim-rbac.yaml's Role,
# substituting metadata.name, PROPOSAL and PROPOSAL_ID.
#
# Prereq ConfigMap:
#   oc create configmap sim-src -n agent-school \
#     --from-file=cell_sleep_sim.py=../../../sim/cell_sleep_sim.py
#
# Venice note: add nvidia.com/gpu to resources and swap jax[cpu] for a
# CUDA jax wheel to run large sweeps on the 96G card.
apiVersion: batch/v1
kind: Job
metadata:
  name: cell-sleep-sim-manual   # the agent generates unique names
  namespace: agent-school
  labels:
    kueue.x-k8s.io/queue-name: agent-school-queue
    app.kubernetes.io/part-of: agent-school
    app: cell-sleep-sim
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 1200
  template:
    metadata:
      labels: {app: cell-sleep-sim}
    spec:
      restartPolicy: Never
      volumes:
        - name: src
          configMap: {name: sim-src}
      containers:
        - name: sim
          image: registry.access.redhat.com/ubi9/python-311:latest
          envFrom:
            - configMapRef: {name: mlflow-tracking}
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
            - {name: MLFLOW_EXPERIMENT, value: 302-energy-optimizer}
            - {name: PROPOSAL_ID, value: manual}
            - {name: PROPOSAL,
               value: '{"cells": 6, "windows": [{"cell": 4, "start_hour": 1, "end_hour": 5}, {"cell": 5, "start_hour": 0, "end_hour": 6}]}'}
          command:
            - /bin/sh
            - -c
            - >
              pip install -q "jax[cpu]" mlflow==3.4.0 &&
              python3 /src/cell_sleep_sim.py
          volumeMounts:
            - {name: src, mountPath: /src}
          resources:
            requests: {cpu: "1", memory: 1Gi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
