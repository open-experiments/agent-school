</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8a8a8a"/></marker><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#C0392B"/></marker></defs><rect width="1320" height="900" fill="#ffffff"/><rect x="20" y="44" width="250" height="812" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="36" y="70">EXTERNAL</text><rect x="300" y="44" width="995" height="812" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="316" y="70">OPENSHIFT SNO "ROME" · RED HAT OPENSHIFT AI 3.5</text><g class="c-gray"><rect x="35" y="100" width="220" height="120" rx="8"/><text class="th" x="145" y="128" text-anchor="middle">5gprod dataset (via 101)</text><text class="ts" x="145" y="154" text-anchor="middle">logs · metrics · alert feed</text><text class="ts" x="145" y="172" text-anchor="middle">source: Telco-AIX llm-rca</text></g><g class="c-gray"><rect x="35" y="395" width="220" height="120" rx="8"/><text class="th" x="145" y="423" text-anchor="middle">Learner laptop</text><text class="ts" x="145" y="449" text-anchor="middle">offline mode · deterministic</text><text class="ts" x="145" y="467" text-anchor="middle">episode, no LLM needed</text></g><g class="c-green"><rect x="35" y="700" width="220" height="115" rx="8"/><text class="th" x="145" y="728" text-anchor="middle">RHOAI MaaS</text><text class="ts" x="145" y="754" text-anchor="middle">LiteLLM gateway ·</text><text class="ts" x="145" y="772" text-anchor="middle">QA-d live path</text></g><g class="c-amber"><rect x="330" y="100" width="255" height="185" rx="8"/><text class="th" x="457" y="128" text-anchor="middle">RAG service · skill backend</text><text class="ts" x="457" y="154" text-anchor="middle">pattern 2 · Deployment + Service</text><text class="ts" x="457" y="172" text-anchor="middle">TF-IDF over 4,330 real</text><text class="ts" x="457" y="190" text-anchor="middle">log / metric / alert records</text><text class="ts" x="457" y="208" text-anchor="middle">FAISS = backend-only swap</text><text class="ts" x="457" y="226" text-anchor="middle">the index never lives in the pod</text></g><g class="tab-pod"><rect x="348" y="90" width="35" height="20" rx="6"/><text x="365" y="104" text-anchor="middle">POD</text></g><g class="c-green"><rect x="620" y="100" width="255" height="185" rx="8"/><text class="th" x="747" y="128" text-anchor="middle">vLLM on RHOAI (KServe)</text><text class="ts" x="747" y="154" text-anchor="middle">Kimi-Linear-48B-A3B</text><text class="ts" x="747" y="172" text-anchor="middle">OpenAI-compatible /v1</text><text class="ts" x="747" y="190" text-anchor="middle">serves the AGENT and</text><text class="ts" x="747" y="208" text-anchor="middle">the JUDGE · no external API</text></g><g class="tab-rhoai"><rect x="638" y="90" width="107" height="20" rx="6"/><text x="691" y="104" text-anchor="middle">RHOAI · KServe</text></g><g class="c-blue"><rect x="910" y="100" width="365" height="185" rx="8"/><text class="th" x="1092" y="128" text-anchor="middle">MLflow · workspace agent-school</text><text class="ts" x="1092" y="154" text-anchor="middle">experiment 201-rca-investigator</text><text class="ts" x="1092" y="172" text-anchor="middle">17 traces · tokens · latency</text><text class="ts" x="1092" y="190" text-anchor="middle">Judges · evidence-grounding</text><text class="ts" x="1092" y="208" text-anchor="middle">verdicts attached to traces</text><text class="ts" x="1092" y="226" text-anchor="middle">as assessments (GenAI view)</text></g><g class="tab-rhoai"><rect x="928" y="90" width="107" height="20" rx="6"/><text x="981" y="104" text-anchor="middle">RHOAI · MLflow</text></g><g class="c-agent"><rect x="500" y="400" width="410" height="205" rx="12"/><text class="agent-t" x="705" y="442" text-anchor="middle">RCA Investigator agent</text><text class="ts" x="705" y="466" text-anchor="middle">ephemeral Job · CPU-only · UBI9 · restricted PSS</text><text class="agent-flow" x="705" y="502" text-anchor="middle">investigate → write</text><text class="ts" x="705" y="530" text-anchor="middle">Phase 1 gathers evidence (RCA_MAX_TURNS) · Phase 2 writes a</text><text class="ts" x="705" y="548" text-anchor="middle">report where every claim cites a [record-id] · Job exits clean</text></g><g class="tab-pod"><rect x="516" y="389" width="41" height="23" rx="6"/><text x="536" y="405" text-anchor="middle">POD</text></g><g class="c-amber"><rect x="965" y="405" width="300" height="155" rx="8"/><text class="th" x="1115" y="433" text-anchor="middle">LLM-as-a-Judge (eval run)</text><text class="ts" x="1115" y="459" text-anchor="middle">runs on the cluster Kimi (vLLM) ·</text><text class="ts" x="1115" y="477" text-anchor="middle">scores the agent’s evidence-</text><text class="ts" x="1115" y="495" text-anchor="middle">grounding · verdicts become</text><text class="ts" x="1115" y="513" text-anchor="middle">MLflow assessments</text></g><g class="tab-pod"><rect x="983" y="395" width="35" height="20" rx="6"/><text x="1000" y="409" text-anchor="middle">POD</text></g><g class="tab-rhoai"><rect x="983" y="550" width="152" height="20" rx="6"/><text x="1059" y="564" text-anchor="middle">RHOAI · Model Serving</text></g><polyline class="arrow-h" points="560,400 560,287" marker-end="url(#ah)"/><text class="tl" x="546" y="360" text-anchor="middle">①</text><polyline class="arrow-h" points="700,400 700,287" marker-end="url(#ah)"/><text class="tl" x="686" y="360" text-anchor="middle">②</text><polyline class="arrow-h" points="860,400 860,360 1010,360 1010,287" marker-end="url(#ah)"/><text class="tl" x="888" y="350" text-anchor="middle">③</text><polyline class="arrow" points="1115,405 1115,287" marker-end="url(#a)"/><text class="tl" x="1150" y="350" text-anchor="middle">verdicts</text><polyline class="arrow" points="255,150 326,175" marker-end="url(#a)"/><text class="tl" x="292" y="146" text-anchor="middle">index</text><polyline class="arrow dashed" points="145,700 145,548 496,548" marker-end="url(#a)"/><text class="tl" x="345" y="542" text-anchor="middle">alt LLM path · same OpenAI contract</text><text class="tl" x="660" y="812" text-anchor="middle">Tabs: red POD = a Pod you ship (a workload) · blue = the RHOAI platform feature/service · left column = external</text><text class="ts" x="660" y="835" text-anchor="middle">① query · top-k evidence (RAG) · ② reason · vLLM · ③ every step traced to MLflow · ④ the platform Kimi judges evidence-grounding, verdicts → assessments</text><text class="ts" x="660" y="876" text-anchor="middle">RCA Investigator architecture</text></svg>