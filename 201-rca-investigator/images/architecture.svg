<svg viewBox="0 0 1180 790" width="1180" height="790" xmlns="http://www.w3.org/2000/svg">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: #2a2a2a; }
