# Workspace RBAC for MLflow tracking; see the 101 counterpart for rationale.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rca-investigator-mlflow
  labels:
    app.kubernetes.io/name: rca-investigator
    app.kubernetes.io/part-of: agent-school
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: rca-investigator
    namespace: agent-school
