<text class="ts" x="490" y="272" text-anchor="middle">same MCP tools, product loop</text>
</g>
<g class="c-gray">
<rect x="350" y="306" width="280" height="50" rx="8"/>
<text class="ts" x="490" y="336" text-anchor="middle">trace: stdout · MLflow (optional)</text>
</g>
<line x1="350" y1="130" x2="274" y2="130" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text class="ts" x="312" y="120" text-anchor="middle">MCP</text>

<g class="c-green">
<rect x="710" y="84" width="220" height="120" rx="8"/>
<text class="th" x="820" y="116" text-anchor="middle">LLM endpoint</text>
<text class="ts" x="820" y="140" text-anchor="middle">llama.cpp (local dev)</text>
<text class="ts" x="820" y="160" text-anchor="middle">vLLM on RHOAI (target)</text>
<text class="ts" x="820" y="180" text-anchor="middle">OpenAI-compatible API</text>
</g>
<line x1="650" y1="130" x2="704" y2="130" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#a)"/>
<text class="ts" x="677" y="120" text-anchor="middle">chat + tools</text>

<text class="ts" x="480" y="410" text-anchor="middle">Blueprint mapping: harness in pod · skills behind MCP · model as stateless service · no GPU in the agent pod</text>
</svg>
