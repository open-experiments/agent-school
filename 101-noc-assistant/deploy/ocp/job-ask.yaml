# One agent run = one Job: the agent asks, answers, and exits.
# oc create -f job-ask.yaml   (or: kustomize edit set the QUESTION)
apiVersion: batch/v1
kind: Job
metadata:
  generateName: noc-ask-
  labels:
    app.kubernetes.io/name: noc-assistant
    app.kubernetes.io/part-of: agent-school
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: noc-assistant
    spec:
      restartPolicy: Never
      serviceAccountName: noc-assistant
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: image-registry.openshift-image-registry.svc:5000/agent-school/noc-assistant:latest
          env:
            - name: QUESTION
              value: "What is wrong in the 5G core right now, and what should the NOC do about it?"
          envFrom:
            - secretRef:
                name: llm-credentials
            # Experiments tracking config; supplied by overlays (deploy/ocp/rome),
            # absent everywhere else, so tracking is opt-in per environment.
            - configMapRef:
                name: mlflow-tracking
                optional: true
            # Feast online-store client config; same opt-in pattern.
            - configMapRef:
                name: feature-store-client
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
