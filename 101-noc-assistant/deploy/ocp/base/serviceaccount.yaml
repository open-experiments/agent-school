# Agent identity: each agent runs under its own ServiceAccount, never
# `default`. This is the governance hook the platform builds on — RBAC for
# workspace-scoped services (MLflow Experiments tracking), NetworkPolicies,
# and audit all key off this identity. See the article's Agent-as-a-Workload
# pattern: the agent is a plain workload, so platform identity is plain
# Kubernetes identity.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: noc-assistant
  labels:
    app.kubernetes.io/name: noc-assistant
    app.kubernetes.io/part-of: agent-school
