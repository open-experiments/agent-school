apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: noc-assistant
  labels:
    app.kubernetes.io/part-of: agent-school
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: noc-assistant
  labels:
    app.kubernetes.io/part-of: agent-school
spec:
  source:
    type: Git
    git:
      # adjust to your fork
      uri: https://github.com/open-experiments/agent-school.git
      ref: main
    contextDir: 101-noc-assistant
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: deploy/Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: noc-assistant:latest
  triggers:
    - type: ConfigChange
# No git remote yet? Binary build instead:
#   oc start-build noc-assistant --from-dir=101-noc-assistant --follow
