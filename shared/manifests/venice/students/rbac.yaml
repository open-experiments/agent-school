# Student access — RBAC only, no cluster-scoped power.
#
# Group `agent-school-students` gets the built-in `edit` ClusterRole,
# bound ONLY inside the agent-school namespace: create/run/delete
# workloads, exec into pods, read logs — but no roles, no quotas, no
# nodes, no operators, no other namespaces.
#
# Users are added to the group by setup-students.sh (oc adm groups new).
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-school-students-edit
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: agent-school-students
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
