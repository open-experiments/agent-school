# LLM credentials consumed by agent Jobs via envFrom. Create once per
# namespace; never commit a filled-in copy (keys/ and .env are gitignored).
#
#   oc create secret generic llm-credentials \
#     --from-literal=LLM_BASE_URL=https://litellm-litemaas.apps.prod.rhoai.rh-aiservices-bu.com/v1 \
#     --from-literal=LLM_API_KEY=sk-... \
#     --from-literal=LLM_MODEL=Qwen3.6-35B-A3B \
#     --from-literal=LLM_MODEL_SMALL=Qwen3.6-35B-A3B \
#     --from-literal=LLM_MODEL_LARGE=Qwen3.6-35B-A3B
#
apiVersion: v1
kind: Secret
metadata:
  name: llm-credentials
type: Opaque
stringData:
  LLM_BASE_URL: https://your-endpoint/v1
  LLM_API_KEY: sk-replace-me
  LLM_MODEL: your-model
  LLM_MODEL_SMALL: your-model
  LLM_MODEL_LARGE: your-model
