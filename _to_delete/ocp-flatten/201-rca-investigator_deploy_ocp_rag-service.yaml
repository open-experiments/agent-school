# Pattern-2 skill backend: the retrieval index lives here, never in the
# agent pod. Scale this independently of agents.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rca-rag
  labels:
    app.kubernetes.io/name: rca-rag
    app.kubernetes.io/part-of: agent-school
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rca-rag
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rca-rag
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: rag
          image: image-registry.openshift-image-registry.svc:5000/agent-school/rca-investigator:latest
          ports:
            - containerPort: 8201
              name: http
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rca-rag
  labels:
    app.kubernetes.io/name: rca-rag
    app.kubernetes.io/part-of: agent-school
spec:
  selector:
    app.kubernetes.io/name: rca-rag
  ports:
    - name: http
      port: 8201
      targetPort: http
