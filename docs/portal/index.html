<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Red Hat OpenShift AI · Agent School Lab</title>
<style>
:root{--mast:#151515;--nav:#1b1d21;--navhov:#2b2e33;--bg:#0f1114;--card:#1f2226;--line:#3c3f42;
  --ink:#f0f0f0;--muted:#9ba0a5;--red:#e00;--redl:#f56d6d;--blue:#2b9af3;--ok:#5ba352;--warn:#f0ab00;--purple:#a18fff;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:"RedHatText","Segoe UI",-apple-system,Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
a{color:var(--blue);text-decoration:none;cursor:pointer}
/* masthead */
#mast{flex:0 0 52px;background:var(--mast);display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid #000}
#mast .logo{display:flex;align-items:center;gap:8px;font-size:16px}
#mast .fedora{width:26px;height:26px;border-radius:50%;background:var(--red);display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;font-size:13px}
#mast .logo b{font-weight:700}
#mast .replay{margin-left:18px;font-size:11px;color:var(--warn);border:1px solid #5a4a12;border-radius:5px;padding:3px 8px;letter-spacing:.04em}
#mast .right{margin-left:auto;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:13px}
#mast .right .user{border:1px solid var(--line);border-radius:5px;padding:4px 10px;color:var(--ink)}
#termbtn{background:#0a0a0a;border:1px solid var(--line);color:var(--ink);border-radius:5px;padding:5px 12px;font-family:var(--mono);font-size:12px;cursor:pointer}
#termbtn.attn{border-color:var(--warn);color:var(--warn);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.55}}
/* layout */
#shell{flex:1;display:flex;min-height:0}
nav{flex:0 0 250px;background:var(--nav);overflow-y:auto;padding:6px 0;font-size:13.5px}
nav .grp{padding:10px 18px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-weight:500}
nav .grp:hover{background:var(--navhov)}
nav .grp .chev{color:var(--muted);font-size:11px;transition:transform .15s}
nav .grp.open .chev{transform:rotate(180deg)}
nav .item{padding:8px 18px;color:#d2d2d2;cursor:pointer;border-left:3px solid transparent;display:none}
nav .item.l1{padding-left:34px} nav .item.l2{padding-left:50px}
nav .top{display:block}
nav .visible{display:block}
nav .item:hover{background:var(--navhov)}
nav .item.on{background:var(--navhov);border-left-color:var(--red);color:#fff}
nav .item.glow{color:var(--warn);animation:pulse 1.4s infinite}
#content{flex:1;overflow-y:auto;padding:22px 28px;min-width:0}
#content h1{font-size:22px;font-weight:400;margin-bottom:2px;display:flex;align-items:center;gap:10px}
#content h1 .picon{width:30px;height:30px;border-radius:50%;background:#3d3663;display:inline-flex;align-items:center;justify-content:center;font-size:15px}
#content .crumb{color:var(--muted);font-size:12px;margin:6px 0 12px}
#content .lede{color:var(--muted);font-size:13px;margin-bottom:14px;max-width:980px;line-height:1.5}
.tabs{display:flex;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs div{padding:9px 16px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;font-size:13.5px}
.tabs div.on{color:#fff;border-bottom-color:var(--red)}
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;font-size:13px;color:var(--muted)}
.toolbar .sel{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 12px;color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:12px}
.card h3{font-size:15px;font-weight:600;margin-bottom:8px}
table{width:100%;border-collapse:collapse;font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
th{text-align:left;font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);color:var(--ink);font-size:12.5px;white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid #2a2d31;vertical-align:top}
tr:last-child td{border-bottom:none}
td .sub{color:var(--muted);font-size:11.5px;margin-top:2px}
.lbl{display:inline-block;border-radius:10px;padding:1px 9px;font-size:11.5px;font-weight:600}
.lbl.ok{background:#1c2f1a;color:#7fc379;border:1px solid #2f4d2c}
.lbl.blue{background:#12293d;color:#73bcf7;border:1px solid #1e4666}
.lbl.live{background:#1c2f1a;color:#7fc379;border:1px solid #2f4d2c}
.lbl.warn{background:#3d2e12;color:#f0ab00;border:1px solid #66511e}
.empty{color:var(--muted);padding:38px;text-align:center;border:1px dashed var(--line);border-radius:8px;font-size:13px}
.mono{font-family:var(--mono);font-size:12px}
.pagefoot{color:var(--muted);font-size:12px;margin-top:8px;text-align:right}
/* guide */
#guide{position:fixed;right:18px;bottom:18px;transition:bottom .22s;width:392px;background:#101216;border:1px solid var(--line);border-top:3px solid var(--red);
  border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.55);z-index:40;max-height:72vh;display:flex;flex-direction:column}
#guide.lift{bottom:calc(44vh + 14px);max-height:calc(52vh - 30px)}
#guide .head{padding:11px 14px;display:flex;align-items:center;gap:10px;cursor:pointer}
#guide .stepchip{background:var(--blue);color:#fff;font-weight:700;font-size:11.5px;border-radius:5px;padding:3px 9px;font-family:var(--mono);white-space:nowrap}
#guide .head b{font-size:14px}
#guide .head .min{margin-left:auto;color:var(--muted)}
#guide .body{overflow-y:auto;padding:0 14px 12px}
#guide h5{font-size:10.5px;letter-spacing:.1em;color:var(--redl);font-family:var(--mono);margin:10px 0 4px}
#guide p{font-size:12.8px;line-height:1.5;color:#cfd4d9;white-space:pre-wrap}
#guide code{background:#1c2129;border:1px solid var(--line);border-radius:4px;padding:0 4px;font-family:var(--mono);font-size:11.5px}
#guide .cb{display:block;background:#1c2129;border:1px solid var(--line);border-radius:6px;padding:7px;font-family:var(--mono);font-size:11px;margin:6px 0;white-space:pre-wrap}
#guide .task{border:1px solid var(--warn);border-radius:8px;padding:9px 11px;margin:10px 0;font-size:12.8px}
#guide .task.done{border-color:var(--ok)}
#guide .task .tt{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;color:var(--warn)}
#guide .task.done .tt{color:var(--ok)}
#guide .foot{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:8px}
#guide button{font-family:var(--sans);font-weight:600;font-size:13px;border-radius:6px;border:1px solid var(--line);background:#1c2129;color:var(--ink);padding:8px 14px;cursor:pointer}
#guide button.red{background:var(--red);border-color:var(--red);color:#fff}
#guide button:disabled{opacity:.35;cursor:default}
#guide .dots{margin-left:auto;display:flex;gap:4px;align-items:center}
#guide .dots i{width:8px;height:8px;border-radius:50%;background:var(--line);display:block}
#guide .dots i.done{background:var(--ok)} #guide .dots i.cur{background:var(--blue)}
#guide.min .body,#guide.min .foot{display:none}
/* terminal */
#drawer{position:fixed;left:0;right:0;bottom:0;height:44vh;background:#0a0c0f;border-top:2px solid var(--line);z-index:30;
  transform:translateY(100%);transition:transform .22s;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .bar{padding:7px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #22262a;font-family:var(--mono);font-size:12px;color:var(--muted)}
#drawer .bar b{color:var(--ink)}
#runbtn{background:var(--red);border:none;color:#fff;border-radius:5px;padding:5px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:var(--sans)}
#runbtn:disabled{opacity:.35;cursor:default}
#tout{flex:1;overflow-y:auto;padding:12px 16px;font-family:var(--mono);font-size:12.3px;line-height:1.55;color:#b9c2cc;white-space:pre-wrap;word-break:break-all}
#tout .p{color:#7fc379;font-weight:600}
#tout .path{color:#73bcf7}
#tout .recon{color:#8b949e;font-style:italic}
#tsrc{margin-left:auto}
#loading{padding:70px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<div id="mast">
  <div class="logo"><span class="fedora">RH</span><span><b>Red Hat</b> OpenShift AI</span></div>
  <span class="replay" id="replaybadge">TIME-SNAPSHOTTED REPLAY</span>
  <div class="right">
    <button id="termbtn" onclick="toggleDrawer()">&gt;_ Terminal</button>
    <span>🔔</span><span>⋮⋮⋮</span><span>?</span><span class="user">kube:admin ▾</span>
  </div>
</div>
<div id="shell" style="display:none">
  <nav id="nav"></nav>
  <div id="content"></div>
</div>
<div id="loading">Loading tape…</div>

<div id="guide" style="display:none">
  <div class="head" onclick="document.getElementById('guide').classList.toggle('min')">
    <span class="stepchip" id="gchip">STEP 1/7</span><b id="gtitle"></b><span class="min">▾</span>
  </div>
  <div class="body" id="gbody"></div>
  <div class="foot">
    <button class="red" id="gaction">Open terminal</button>
    <button id="gnav" style="display:none">Take me there →</button>
    <button id="gnext" disabled>Next ▸</button>
    <div class="dots" id="gdots"></div>
  </div>
</div>

<div id="drawer">
  <div class="bar"><b>Web terminal</b> · oc · project agent-school · repo <span class="path">open-experiments/agent-school</span>
    <button id="runbtn" onclick="runStep()">Run step commands</button>
    <span id="tsrc"></span>
    <a onclick="toggleDrawer()" style="margin-left:14px;color:var(--muted)">✕ close</a></div>
  <div id="tout"></div>
</div>

<script>
const qs=new URLSearchParams(location.search);
const tapeName=qs.get('tape')||'101-venice';
let TAPE=null,cur=0,ran=new Set(),found=new Set(),revealed=new Set(),playing=false,page='home',modelsTab='registry';
const $=id=>document.getElementById(id);
const PANEL2PAGE={resources:'projects',featurestore:'fs-views',experiments:'experiments',workloads:'metrics',registry:'models',deployments:'models',pipelines:'pipelines',jobs:'jobs'};
const PANEL2TAB={registry:'registry',deployments:'deployments'};
const PAGEPATH={home:['Home'],projects:['Data science projects'],models:['AI hub','Models'],
  'fs-overview':['Develop & train','Feature store','Overview'],'fs-entities':['Develop & train','Feature store','Entities'],
  'fs-sources':['Develop & train','Feature store','Data sources'],'fs-datasets':['Develop & train','Feature store','Datasets'],
  'fs-features':['Develop & train','Feature store','Features'],'fs-views':['Develop & train','Feature store','Feature views'],
  'fs-services':['Develop & train','Feature store','Feature services'],
  pipelines:['Develop & train','Pipelines'],experiments:['Develop & train','Experiments'],jobs:['Develop & train','Jobs'],
  metrics:['Observe & monitor','Workload metrics'],learning:['Learning resources'],applications:['Applications'],settings:['Settings']};

fetch('tapes/'+tapeName+'.json').then(r=>{if(!r.ok)throw 0;return r.json()}).then(t=>{TAPE=t;init();})
 .catch(()=>{$('loading').textContent='Tape "'+tapeName+'" not found.'});

const NAV=[
 {id:'home',label:'Home',top:1},
 {id:'projects',label:'Projects',top:1},
 {grp:'AI hub',items:[{id:'models',label:'Models',lvl:1}]},
 {grp:'Gen AI studio',items:[{id:'playground',label:'API keys',lvl:1}]},
 {grp:'Develop & train',open:true,items:[
   {id:'fs-overview',label:'Feature store',lvl:1,grp2:'fs'},
   {id:'fs-entities',label:'Entities',lvl:2,fs:1},{id:'fs-sources',label:'Data sources',lvl:2,fs:1},
   {id:'fs-datasets',label:'Datasets',lvl:2,fs:1},{id:'fs-features',label:'Features',lvl:2,fs:1},
   {id:'fs-views',label:'Feature views',lvl:2,fs:1},{id:'fs-services',label:'Feature services',lvl:2,fs:1},
   {id:'pipelines',label:'Pipelines',lvl:1},{id:'experiments',label:'Experiments',lvl:1},{id:'jobs',label:'Jobs',lvl:1}]},
 {grp:'Observe & monitor',items:[{id:'metrics',label:'Workload metrics',lvl:1}]},
 {id:'learning',label:'Learning resources',top:1},
 {id:'applications',label:'Applications',top:1},
 {id:'settings',label:'Settings',top:1}
];

function init(){
  $('loading').style.display='none';$('shell').style.display='flex';$('guide').style.display='flex';
  $('replaybadge').textContent='TIME-SNAPSHOTTED REPLAY · '+TAPE.cluster+' · '+TAPE.capturedAt.slice(0,10);
  const nav=$('nav');
  NAV.forEach(n=>{
    if(n.grp){
      const g=document.createElement('div');g.className='grp'+(n.open?' open':'');g.innerHTML='<span>'+n.grp+'</span><span class="chev">⌄</span>';
      g.onclick=()=>{g.classList.toggle('open');n.items.forEach(it=>{const e=$('nav-'+it.id);if(g.classList.contains('open')){if(!it.fs||fsOpen)e.classList.add('visible');}else e.classList.remove('visible');});};
      nav.appendChild(g);n._g=g;
      n.items.forEach(it=>{const d=document.createElement('div');d.className='item l'+(it.lvl||1)+(n.open&&(!it.fs)?' visible':'');d.id='nav-'+it.id;
        d.textContent=it.label;d.onclick=()=>{if(it.grp2==='fs'){toggleFs();}go(it.id);};nav.appendChild(d);});
    } else {
      const d=document.createElement('div');d.className='item top';d.id='nav-'+n.id;d.style.paddingLeft='18px';
      d.textContent=n.label;d.onclick=()=>go(n.id);nav.appendChild(d);
    }
  });
  $('gdots').innerHTML=TAPE.steps.map((_,i)=>'<i id="dot'+i+'"></i>').join('');
  $('gnext').onclick=()=>{if(cur<TAPE.steps.length-1)setStep(cur+1);};
  $('gnav').onclick=()=>{const t=target(cur);openPathTo(t);go(t);const tb=targetTab(cur);if(tb)setTab(tb);};
  $('gaction').onclick=()=>{if(!$('drawer').classList.contains('open'))toggleDrawer();};
  TAPE.steps.forEach(s=>((s.playback||{}).reveal||[]).forEach(r=>{if(r.startsWith('exp:'))expGated.add(r.slice(4));}));
  setStep(0);go('home');
}
let fsOpen=false;
function toggleFs(force){fsOpen=(force!==undefined)?force:!fsOpen;
  NAV.forEach(n=>{if(n.grp!=='Develop & train')return;n.items.forEach(it=>{if(it.fs)$('nav-'+it.id).classList.toggle('visible',fsOpen);});});}
let expGated=new Set();
function target(i){return PANEL2PAGE[(TAPE.steps[i].playback.dashboard||{}).panel]||'projects';}
function targetTab(i){return PANEL2TAB[(TAPE.steps[i].playback.dashboard||{}).panel]||null;}
function tryFound(){if(ran.has(cur)&&page===target(cur)&&(!targetTab(cur)||modelsTab===targetTab(cur))){found.add(cur);renderGuide();refreshDots();}}
function setTab(t){modelsTab=t;tryFound();render();}
function md(s){s=s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  s=s.replace(/```([\s\S]*?)```/g,(_,c)=>'<span class="cb">'+c.trim()+'</span>');
  return s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;');}
const dt=()=>TAPE.capturedAt.slice(0,10);
const fsEmpty=()=>TAPE.course==='101'?'It appears after Step 4.':'The feature store belongs to the course 101 lab. Open the 101 lab to explore it.';

function setStep(i){
  cur=i;const s=TAPE.steps[i];
  for(let k=0;k<i;k++){ran.add(k);found.add(k);(TAPE.steps[k].playback.reveal||[]).forEach(r=>revealed.add(r));}
  $('gchip').textContent='STEP '+s.n+'/'+TAPE.steps.length;
  $('gtitle').textContent=s.title;
  renderGuide();refreshDots();render();
  $('termbtn').classList.add('attn');
}
function renderGuide(){
  const s=TAPE.steps[cur];
  const didRun=ran.has(cur),didFind=found.has(cur);
  const tb=targetTab(cur),t=target(cur),path=PAGEPATH[t].join(' → ')+(tb?' → '+tb.charAt(0).toUpperCase()+tb.slice(1)+' tab':'');
  let h='<h5>Why this step</h5><p>'+md(s.why)+'</p>';
  h+='<div class="task'+(didRun?' done':'')+'"><span class="tt">'+(didRun?'✓ DONE':'TASK 1')+'</span><p style="margin-top:4px">Open the <b>&gt;_ Terminal</b> and run the step\'s <code>oc</code> commands ('+s.cmds.length+' commands, real repo paths).</p></div>';
  h+='<div class="task'+(didFind?' done':'')+'"><span class="tt">'+(didFind?'✓ VERIFIED':'TASK 2')+'</span><p style="margin-top:4px">Find the result in the portal: <b>'+path+'</b></p></div>';
  h+='<h5>Expect</h5><p>'+md(s.expect)+'</p>';
  if(didRun&&didFind&&s.check){const a=TAPE.assets.resources[s.check.asset];
    const v=s.check.path.split('.').reduce((o,k)=>o&&o[k],a);
    h+='<p style="color:var(--ok);font-family:var(--mono);font-size:11.5px;margin-top:6px">✓ verified against the recorded cluster: '+s.check.path+' = '+JSON.stringify(v)+'</p>';}
  $('gbody').innerHTML=h;
  $('gaction').style.display=didRun?'none':'';
  $('gnav').style.display=(didRun&&!didFind)?'':'none';
  $('gnext').disabled=!(didRun&&didFind);
  if(cur===TAPE.steps.length-1&&didRun&&didFind){$('gnext').disabled=true;$('gnext').textContent='Course complete ✓';}
}
function refreshDots(){TAPE.steps.forEach((_,k)=>{const d=$('dot'+k);d.className=(ran.has(k)&&found.has(k))?'done':(k===cur?'cur':'');});}
function toggleDrawer(){const open=$('drawer').classList.toggle('open');$('guide').classList.toggle('lift',open);$('termbtn').classList.remove('attn');}

async function runStep(){
  if(playing||ran.has(cur))return;playing=true;$('runbtn').disabled=true;
  const s=TAPE.steps[cur];
  $('tsrc').textContent=s.playback.reconstructed?'⚠ outputs reconstructed from live session records':'● outputs recorded verbatim from the live cluster';
  const term=$('tout');term.innerHTML='';
  for(const c of s.cmds){
    const pd=document.createElement('div');pd.className='p';
    pd.innerHTML='$ '+esc(c.cmd).replace(/((?:\d{3}-[a-z-]+|shared)\/[^\s\\'"]+)/g,'<span class="path">$1</span>');
    term.appendChild(pd);term.scrollTop=term.scrollHeight;
    const lines=c.log?TAPE.assets.logs[c.log]:c.out;
    let last=0;
    for(const[t,text]of lines){
      await sleep(Math.min(Math.max(t-last,20),420));last=t;
      const d=document.createElement('div');if(s.playback.reconstructed&&!c.log)d.className='recon';
      d.textContent=text;term.appendChild(d);term.scrollTop=term.scrollHeight;
    }
    const gap=document.createElement('div');gap.innerHTML='&nbsp;';term.appendChild(gap);
    await sleep(180);
  }
  (s.playback.reveal||[]).forEach(r=>revealed.add(r));
  ran.add(cur);playing=false;$('runbtn').disabled=false;
  const t=target(cur);openPathTo(t);const nd=$('nav-'+t);if(nd)nd.classList.add('glow');
  renderGuide();render();
}
function openPathTo(id){
  if(id.startsWith('fs-')){toggleFs(true);NAV[4]._g.classList.add('open');NAV[4].items.forEach(it=>{if(!it.fs||fsOpen)$('nav-'+it.id).classList.add('visible');});}
  NAV.forEach(n=>{if(n.grp&&n.items.some(it=>it.id===id)&&!n._g.classList.contains('open')){n._g.click();}});
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

function go(p){
  page=p;document.querySelectorAll('nav .item').forEach(d=>d.classList.remove('on'));
  const nd=$('nav-'+p);if(nd){nd.classList.add('on');nd.classList.remove('glow');}
  tryFound();
  render();
}
/* pages */
function crumb(p){return '<div class="crumb">'+PAGEPATH[p].join(' / ')+'</div>';}
function note(p){const s=TAPE.steps[cur],d=s.playback.dashboard||{};
  if(PANEL2TAB[d.panel]&&modelsTab!==PANEL2TAB[d.panel])return '';
  return (ran.has(cur)&&PANEL2PAGE[d.panel]===p&&d.note)?'<div class="card" style="border-color:var(--blue)"><p style="font-size:13px">'+md(d.note)+'</p></div>':'';}
const vis=k=>revealed.has(k);
function render(){
  const A=TAPE.assets,el=$('content');let h='';
  if(page==='home'){h='<h1>'+TAPE.title+' · Interactive Lab</h1><div class="lede">A replay of the real <b>'+TAPE.cluster+'</b> cluster, captured '+dt()+'. Follow the guide card: run each step\'s <code>oc</code> commands in the web terminal, then find the result in this portal, exactly as on a live Red Hat OpenShift AI cluster. Every value below was recorded from the live system.</div>'
    +'<div class="card"><h3>Course '+TAPE.course+' · step '+(cur+1)+' of '+TAPE.steps.length+'</h3><p style="font-size:13px;color:var(--muted)"><a href="https://github.com/open-experiments/agent-school/blob/main/'+dirFor(TAPE.course)+'/MANUAL.md" target="_blank">Course Manual ↗</a> · <a href="https://github.com/open-experiments/agent-school" target="_blank">repo ↗</a></p></div>';}
  if(page==='projects'){h='<h1>Data science projects</h1>'+crumb(page)+note(page)
    +'<div class="lede">Projects allow you and your team to organize and collaborate on resources within separate namespaces.</div>';
    if(!ran.has(0))h+='<div class="empty">No data science projects yet. Run Step 1 in the terminal.</div>';
    else{h+='<table><tr><th>Name</th><th>Created</th><th>Owner</th><th>Course objects</th></tr><tr><td><b>agent-school</b><div class="sub">kueue-managed · dashboard workspace · feast enabled</div></td><td>'+dt()+'</td><td>kube:admin</td><td class="mono">';
      const names=Object.entries(A.resources).filter(([k])=>vis(k)&&k!=='kimi-isvc').map(([,r])=>(r.kind?r.kind+'/':'')+r.metadata.name);
      h+=names.length?names.join('<br>'):'(objects appear as you run steps)';h+='</td></tr></table><div class="pagefoot">1 - 1 of 1</div>';}}
  if(page==='models'){
    h='<h1><span class="picon">⧉</span>Models</h1>'+crumb(page)+note(page);
    h+='<div class="tabs"><div id="mt-catalog" '+(modelsTab==='catalog'?'class="on"':'')+' onclick="setTab(\'catalog\')">Catalog</div><div id="mt-registry" '+(modelsTab==='registry'?'class="on"':'')+' onclick="setTab(\'registry\')">Registry</div><div id="mt-deployments" '+(modelsTab==='deployments'?'class="on"':'')+' onclick="setTab(\'deployments\')">Deployments</div></div>';
    if(modelsTab==='registry'){
      h+='<div class="lede">Select a model registry to view and manage your registered models. Model registries provide a structured and organized way to store, share, version, deploy, and track models.</div>';
      h+='<div class="toolbar"><span>Model registry:</span><span class="sel">'+TAPE.cluster+'-registry ▾</span></div>';
      if(!(A.registry||[]).length)h+='<div class="empty">No models registered for this course yet.</div>';
      else{h+='<table><tr><th>Model name</th><th>Latest version</th><th>Last modified</th><th>Status</th></tr>';
        for(const m of A.registry||[]){h+='<tr><td><b>'+m.m.name+'</b><div class="sub">'+(m.m.description||'').slice(0,180)+'</div></td><td class="mono">'+(m.vs[0]?m.vs[0].v.name:'—')+'</td><td>'+dt()+'</td><td><span class="lbl live">'+m.m.state+'</span></td></tr>';}
        h+='</table><div class="pagefoot">1 - '+(A.registry||[]).length+' of '+(A.registry||[]).length+'</div>';}}
    if(modelsTab==='deployments'){
      h+='<div class="lede">Model deployments served by KServe across your projects.</div>';
      h+='<table><tr><th>Model deployment name</th><th>Project</th><th>Serving runtime</th><th>Inference endpoint</th><th>Status</th></tr>';
      let dn=0;
      const row=(r,sub,ready)=>'<tr><td><b>'+r.metadata.name+'</b>'+(sub?'<div class="sub">'+sub+'</div>':'')+'</td><td>'+r.metadata.namespace+'</td><td class="mono">'+((((r.spec||{}).predictor||{}).model||{}).runtime||'')+'</td><td class="mono">'+r.metadata.name+'-predictor.'+r.metadata.namespace+'.svc:8080</td><td><span class="lbl '+(ready?'ok':'warn')+'">'+(ready?'Ready':'Pending')+'</span></td></tr>';
      const k=A.resources['kimi-isvc'];
      if(k){h+=row(k,'the course LLM every agent calls',true);dn++;}
      for(const[key,r]of Object.entries(A.resources))if(r.kind==='InferenceService'&&key!=='kimi-isvc'&&vis(key)){h+=row(r,'',(r.status||{}).ready!==false);dn++;}
      h+='</table>';
      if(!dn)h+='<div class="empty">Model deployments appear here as you run the serving steps.</div>';}
    if(modelsTab==='catalog'){h+='<div class="empty">The model catalog is outside this course tape. Explore it on a live cluster.</div>';}}
  if(page==='fs-overview'){h='<h1>Feature store</h1>'+crumb(page)+note('fs-views');
    if(!vis('featurestore'))h+='<div class="empty">No feature store in this project yet. '+fsEmpty()+'</div>';
    else{const fs=A.resources['featurestore'];const conds=(fs.status&&fs.status.conditions||[]).map(c=>c.type+'='+c.status).join(' · ');
      h+='<div class="card"><h3>fivegprod <span class="lbl ok">'+((fs.status||{}).phase||'Ready')+'</span></h3><p class="mono" style="color:var(--muted)">'+conds+'</p><p class="mono" style="color:var(--muted);margin-top:6px">project: fivegprod · entity: nf · registry + online store on dedicated PVCs</p></div>';
      h+='<div class="card"><h3>Resource counts</h3><table style="border:none"><tr><th>Entities</th><th>Data sources</th><th>Feature views</th><th>Feature services</th><th>Saved datasets</th></tr><tr><td>1</td><td>3</td><td>'+(A.featureViews||[]).length+'</td><td>1</td><td>'+(A.savedDatasets||[]).length+'</td></tr></table></div>';}}
  if(page==='fs-entities'){h='<h1>Entities</h1>'+crumb(page);
    h+=vis('featurestore')?'<table><tr><th>Name</th><th>Join key</th><th>Feature store</th><th>Feature views</th></tr><tr><td><b>nf</b><div class="sub">network function (amf | smf | upf)</div></td><td class="mono">nf_id</td><td>fivegprod</td><td>3</td></tr></table>':'<div class="empty">'+fsEmpty()+'</div>';}
  if(page==='fs-sources'){h='<h1>Data sources</h1>'+crumb(page);
    h+=vis('featurestore')?'<table><tr><th>Name</th><th>Type</th><th>Feature store</th></tr>'+['amf','smf','upf'].map(n=>'<tr><td><b>'+n+'_features</b><div class="sub">offline parquet · engineered 1h rolling KPIs</div></td><td>FileSource</td><td>fivegprod</td></tr>').join('')+'</table>':'<div class="empty">'+fsEmpty()+'</div>';}
  if(page==='fs-features'){h='<h1>Features</h1>'+crumb(page);
    h+=vis('featurestore')?'<div class="lede">118 features across 3 feature views: raw per-minute KPIs + 1h rolling mean/min/max + anomaly_score / anomaly_flag per NF.</div><table><tr><th>Feature view</th><th>Features</th></tr>'+(A.featureViews||[]).map(f=>'<tr><td class="mono">'+f.name+'</td><td>'+f.features+'</td></tr>').join('')+'</table>':'<div class="empty">'+fsEmpty()+'</div>';}
  if(page==='fs-views'){h='<h1>Feature views</h1>'+crumb(page)+note(page);
    if(!vis('featurestore'))h+='<div class="empty">No feature store in this project yet. '+fsEmpty()+'</div>';
    else{h+='<div class="lede">Select a feature view to view and manage its features. A feature view defines how to retrieve a logical group of features from a specific data source. It binds a data source to one or more entities and contains the logic for transforming the raw data into feature values.</div>';
      h+='<div class="toolbar"><span>Feature store:</span><span class="sel">All feature stores ▾</span><a>View connected workbenches</a></div>';
      h+='<table><tr><th>Name</th><th>Feature store</th><th>Tags</th><th>Features</th><th>Created</th><th>Updated</th><th>Owner</th><th>Store type</th></tr>';
      for(const f of A.featureViews||[])h+='<tr><td><b>'+f.name+'</b></td><td>'+f.store+'</td><td>-</td><td><a>'+f.features+' features</a></td><td>'+dt()+'</td><td>'+dt()+'</td><td>-</td><td><span class="lbl ok">✓ '+f.storeType+'</span></td></tr>';
      h+='</table><div class="pagefoot">1 - '+(A.featureViews||[]).length+' of '+(A.featureViews||[]).length+'</div>';}}
  if(page==='fs-services'){h='<h1>Feature services</h1>'+crumb(page);
    h+=vis('featurestore')?'<table><tr><th>Name</th><th>Feature views</th><th>Feature store</th></tr><tr><td><b>noc_telemetry</b><div class="sub">what get_kpi_summary / detect_anomalies read over REST</div></td><td>amf_kpis, smf_kpis, upf_kpis</td><td>fivegprod</td></tr></table>':'<div class="empty">'+fsEmpty()+'</div>';}
  if(page==='fs-datasets'){h='<h1>Datasets</h1>'+crumb(page)+note(page);
    if(!ran.has(4))h+='<div class="empty">'+(TAPE.course==='101'?'SavedDatasets appear after Step 5 (feast-save-datasets).':'The feature store belongs to the course 101 lab.')+'</div>';
    else{h+='<table><tr><th>Saved dataset</th><th>Source</th><th>Created</th></tr>';
      for(const d of A.savedDatasets||[])h+='<tr><td><b>'+d+'</b></td><td class="mono">point-in-time join · offline parquet (fivegprod)</td><td>'+dt()+'</td></tr>';h+='</table>';}}
  if(page==='experiments'){h='<h1>Experiments</h1>'+crumb(page)+note(page);
    const expIdx=TAPE.steps.map((s,i)=>(s.playback.dashboard||{}).panel==='experiments'?i:-1).filter(i=>i>=0);
    const show=expIdx.some(i=>ran.has(i)||cur>=i);
    if(!show)h+='<div class="empty">Runs land here as the course\'s agent and training steps execute.</div>';
    else{h+='<div class="lede">Workspace <b>agent-school</b> · tracked in the managed MLflow. Every agent run and training job in the course lands here.</div>';
      for(const e of A.mlflow.experiments||[]){
      if(expGated.has(e.meta.name)&&!revealed.has('exp:'+e.meta.name))continue;
      h+='<div class="card"><h3>'+e.meta.name+' <span class="lbl blue">'+e.runs.length+' runs</span></h3>';
      if(e.runs.length){h+='<table style="border:none"><tr><th>Run</th><th>Status</th><th>Metrics</th></tr>';
        for(const r of e.runs.slice(0,8)){const m=(r.data&&r.data.metrics||[]).slice(0,4).map(x=>x.key+'='+(+x.value).toFixed(3)).join('  ');
          h+='<tr><td class="mono">'+(r.info.run_name||r.info.run_id.slice(0,10))+'</td><td><span class="lbl ok">'+r.info.status+'</span></td><td class="mono">'+m+'</td></tr>';}
        h+='</table>';}
      else h+='<p style="color:var(--muted);font-size:12.5px">This experiment holds the agent\'s LLM traces (tool calls + reasoning), flushed at the end of each run.</p>';
      h+='</div>';}}}
  if(page==='jobs'){h='<h1>Jobs</h1>'+crumb(page)+note(page);
    const rows=(A.jobsTimeline||[]).filter(j=>ran.has(j.after-1));
    h+=rows.length?'<table><tr><th>Name</th><th>Project</th><th>Status</th></tr>'+rows.map(j=>'<tr><td class="mono">'+j.name+'</td><td>agent-school</td><td><span class="lbl ok">'+j.status+'</span></td></tr>').join('')+'</table>':'<div class="empty">One-shot Jobs appear here as you run the course steps.</div>';}
  if(page==='pipelines'){h='<h1>Pipelines</h1>'+crumb(page)+note(page);
    const dspa=A.resources['dspa'];
    if(dspa&&vis('dspa')){
      const conds=(((dspa.status||{}).conditions)||[]).map(c=>c.type+'='+c.status).join(' · ');
      h+='<div class="card"><h3>Pipeline server: dspa <span class="lbl ok">Ready</span></h3><p class="mono" style="color:var(--muted)">'+conds+'</p><p class="mono" style="color:var(--muted);margin-top:6px">project-scoped stack: api-server · persistence agent · workflow controller · mariadb · object store: dspa-agent-school</p></div>';}
    if(vis('pipelineRuns')&&(A.pipelineRuns||[]).length){
      for(const pr of A.pipelineRuns){
        h+='<div class="card"><h3>'+pr.name+' <span class="lbl ok">'+pr.phase+'</span> <span class="lbl blue">'+(pr.progress||'')+'</span></h3><p class="mono" style="color:var(--muted)">run: '+pr.run+'</p>';
        h+='<table style="border:none"><tr><th>Task</th><th>Type</th><th>Status</th></tr>'+pr.nodes.map(n=>'<tr><td class="mono">'+esc(n.name||'')+'</td><td>'+n.type+'</td><td><span class="lbl ok">'+n.phase+'</span></td></tr>').join('')+'</table></div>';}}
    else if(!(dspa&&vis('dspa')))h+='<div class="empty">'+(A.pipelineRuns!==undefined?'No pipeline server configured yet. It appears when you run the DSPA step.':'Course '+TAPE.course+' does not use Data Science Pipelines.<br>Course 202\'s lab configures a pipeline server here and runs fraud-brf-training end to end.')+'</div>';
    else h+='<div class="empty">Pipeline runs appear after the import-and-run step.</div>';}
  if(page==='metrics'){h='<h1>Workload metrics</h1>'+crumb(page)+note(page);
    h+='<div class="toolbar"><span>Project:</span><span class="sel">agent-school ▾</span></div>';
    const rj=A.resources['rayjob'],wl=A.resources['kueue-workload'];
    if(!rj)h+='<div class="empty">This course\'s workloads run as one-shot Jobs (see Develop &amp; train → Jobs).<br>Kueue queue metrics are exercised by course 101\'s Ray sweep.</div>';
    else if(!vis('rayjob'))h+='<div class="empty">Kueue-admitted workloads appear after Step 7.</div>';
    else{h+='<table><tr><th>Workload</th><th>Type</th><th>Local queue</th><th>Cluster queue</th><th>Status</th></tr>';
      if(wl)h+='<tr><td class="mono">'+wl.metadata.name+'</td><td>RayJob</td><td>agent-school-queue</td><td>default</td><td><span class="lbl ok">Admitted</span></td></tr>';
      h+='</table>';
      if(rj)h+='<div class="card" style="margin-top:12px"><h3>'+rj.metadata.name+' <span class="lbl ok">'+((rj.status||{}).jobStatus||'')+'</span></h3><p class="mono" style="color:var(--muted)">entrypoint: '+esc(rj.spec.entrypoint||'')+' · head + 1 worker · torn down at TTL</p></div>';}}
  if(['playground','learning','applications','settings'].includes(page)){
    const OUTSIDE={playground:'API keys',learning:'Learning resources',applications:'Applications',settings:'Settings'};
    h='<h1>'+OUTSIDE[page]+'</h1><div class="empty">Outside this course tape. Explore it on a live cluster.</div>';}
  el.innerHTML=h;
}
function dirFor(c){return {101:'101-noc-assistant',201:'201-rca-investigator',202:'202-fraud-triage',301:'301-closed-loop-netops',302:'302-energy-optimizer'}[c];}
