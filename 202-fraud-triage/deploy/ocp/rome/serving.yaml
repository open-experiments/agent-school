# Serving for the registered fraud model — KServe on RHOAI 3.5 EA2,
# exactly as deployed on Rome. Fills the AI hub -> Models -> Deployments
# tab for the workspace; the LangGraph agent's score node calls this
# endpoint as its tool.
#
# Flow: job-stage-model.yaml copies the registered version's artifact
# tree from managed MLflow to s3://models/revassurance-fraud-brf/1/ on
# the cluster MinIO -> the data connection below gives the storage
# initializer credentials -> the custom MLServer runtime loads the
# MLflow pyfunc (a custom PythonModel wrapping the BalancedRandomForest
# bundle) and speaks the V2 inference protocol.
#
# Prereq — the data connection secret copies the MinIO creds (never
# committed):
#   oc get secret dspa-minio-creds -n agent-school -o json | jq \
#     '{apiVersion:"v1",kind:"Secret",type:"Opaque",
#       metadata:{name:"aws-connection-minio-models",namespace:"agent-school",
#         labels:{"opendatahub.io/dashboard":"true","opendatahub.io/managed":"true"},
#         annotations:{"openshift.io/display-name":"minio-models",
#           "opendatahub.io/connection-type":"s3",
#           "serving.kserve.io/s3-endpoint":"minio.minio.svc.cluster.local:9000",
#           "serving.kserve.io/s3-usehttps":"0",
#           "serving.kserve.io/s3-region":"minio",
#           "serving.kserve.io/s3-useanoncredential":"false"}},
#       data:{AWS_ACCESS_KEY_ID:.data.accesskey,
#             AWS_SECRET_ACCESS_KEY:.data.secretkey,
#             AWS_S3_ENDPOINT:("http://minio.minio.svc.cluster.local:9000"|@base64),
#             AWS_S3_BUCKET:("models"|@base64),
#             AWS_DEFAULT_REGION:("minio"|@base64)}}' \
#     | oc apply -f -
#
# RHOAI 3.5 EA2 findings baked into this file (all learned live):
# 1. MLServer's parallel-worker pool crashes on load under Python 3.11
#    ("RuntimeError: There is no current event loop in thread
#    'MainThread'", worker exit 256, pod crashloops) —
#    MLSERVER_PARALLEL_WORKERS=0 loads the model in-process and is the
#    fix (and the lighter setup for a single small model anyway).
# 2. The predictor Service KServe creates is HEADLESS: clients must hit
#    the pod port explicitly (:8080) — port 80 connection-refuses. Same
#    convention as the Kimi predictor (101's kustomization notes it).
# 3. Without opendatahub.io/template-* annotations on the
#    ServingRuntime, the Deployments tab shows "Unknown Serving
#    Runtime" for the deployment resource.
# 4. pip-at-startup keeps this on stock UBI9 Python (no custom image to
#    mirror for Venice); cost is ~90s pod start, absorbed by the
#    startupProbe. Bake an image if start latency ever matters.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fraud-serving
  namespace: agent-school
  labels:
    app.kubernetes.io/part-of: agent-school
secrets:
  - name: aws-connection-minio-models
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: fraud-mlserver
  namespace: agent-school
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "MLServer (MLflow pyfunc, pip-at-startup)"
    opendatahub.io/template-name: fraud-mlserver
    opendatahub.io/template-display-name: "MLServer (MLflow pyfunc, pip-at-startup)"
    opendatahub.io/apiProtocol: REST
spec:
  supportedModelFormats:
    - name: mlflow
      version: "2"
      autoSelect: true
  protocolVersions: [v2]
  multiModel: false
  containers:
    - name: kserve-container
      image: registry.access.redhat.com/ubi9/python-311:latest
      command: [/bin/sh, -c]
      args:
        - >
          export HOME=/tmp PIP_NO_CACHE_DIR=1
          MLSERVER_MODEL_IMPLEMENTATION=mlserver_mlflow.MLflowRuntime
          MLSERVER_MODEL_URI=/mnt/models
          MLSERVER_MODEL_NAME=fraud-detector
          MLSERVER_HTTP_PORT=8080 MLSERVER_GRPC_PORT=8081
          MLSERVER_METRICS_PORT=8082 MLSERVER_PARALLEL_WORKERS=0;
          pip install -q mlserver mlserver-mlflow mlflow==3.4.0
          scikit-learn==1.5.2 imbalanced-learn==0.12.4 pandas==2.2.3
          pyarrow==17.0.0 joblib boto3 &&
          cd /tmp && exec mlserver start /tmp
      ports:
        - containerPort: 8080
          protocol: TCP
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
      startupProbe:
        httpGet: {path: /v2/health/live, port: 8080}
        periodSeconds: 10
        failureThreshold: 90
      readinessProbe:
        httpGet: {path: /v2/health/ready, port: 8080}
        periodSeconds: 10
      securityContext:
        allowPrivilegeEscalation: false
        capabilities: {drop: [ALL]}
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: fraud-detector
  namespace: agent-school
  labels:
    opendatahub.io/dashboard: "true"
  annotations:
    openshift.io/display-name: "fraud-detector (revassurance-fraud-brf v1)"
    serving.kserve.io/deploymentMode: Standard
spec:
  predictor:
    serviceAccountName: fraud-serving
    model:
      modelFormat: {name: mlflow}
      runtime: fraud-mlserver
      storageUri: s3://models/revassurance-fraud-brf/1
      resources:
        requests: {cpu: "1", memory: 2Gi}
        limits: {cpu: "2", memory: 4Gi}
