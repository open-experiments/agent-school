# One-shot: live V2-protocol smoke test against the served fraud model,
# with real rows from the published billing dataset. Proof, not vibes:
# prints served fraud_probability/fraud_flag next to the true labels.
# See ../../../serving/infer_smoke.py (headless-Service :8080 gotcha
# documented there).
#
# Prereq ConfigMap:
#   oc create configmap fraud-infer-smoke-src -n agent-school \
#     --from-file=infer_smoke.py=../../../serving/infer_smoke.py
apiVersion: batch/v1
kind: Job
metadata:
  name: fraud-infer-smoke
  namespace: agent-school
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 7200
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      volumes:
        - name: src
          configMap: {name: fraud-infer-smoke-src}
      containers:
        - name: smoke
          image: registry.access.redhat.com/ubi9/python-311:latest
          env:
            - {name: HOME, value: /tmp}
            - {name: PIP_NO_CACHE_DIR, value: "1"}
          command:
            - /bin/sh
            - -c
            - >
              pip install -q pandas numpy &&
              python3 /src/infer_smoke.py
          volumeMounts:
            - {name: src, mountPath: /src}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
            seccompProfile: {type: RuntimeDefault}
