<polyline class="arrow" points="545,440 545,368 455,368 455,336" marker-end="url(#a)"/>
<text class="tl" x="548" y="362" text-anchor="middle">⑤ billing features (Feast online)</text>

<line class="arrow" x1="790" y1="490" x2="844" y2="490" marker-end="url(#a)"/>
<text class="tl" x="818" y="480" text-anchor="middle">⑥</text>

<polyline class="arrow" points="300,630 240,630 240,320 209,320" marker-end="url(#a)"/>
<text class="tl" x="243" y="420" text-anchor="middle">⑦</text>
<text class="tl" x="243" y="436" text-anchor="middle">approve</text>
<text class="tl" x="243" y="452" text-anchor="middle">/ reject</text>

<polyline class="arrow" points="790,630 830,630 830,362 925,362 925,336" marker-end="url(#a)"/>
<text class="tl" x="880" y="380" text-anchor="middle">⑧ audit + traces</text>

<line class="arrow" x1="450" y1="490" x2="466" y2="490" marker-end="url(#a)"/>
<line class="arrow" x1="620" y1="490" x2="636" y2="490" marker-end="url(#a)"/>
<polyline class="arrow" points="700,540 700,576" marker-end="url(#a)"/>
<text class="tl" x="745" y="562" text-anchor="middle">clear · hold</text>
<polyline class="arrow" points="660,540 660,558 430,558 430,576" marker-end="url(#a)"/>
<text class="tl" x="530" y="552" text-anchor="middle">escalate</text>

<polyline class="arrow dashed" points="675,700 675,745 117,745 117,674" marker-end="url(#a)"/>
<text class="tl" x="400" y="738" text-anchor="middle">alt LLM path — same OpenAI-compatible contract</text>

<text class="ts" x="590" y="778" text-anchor="middle">STATUS: PLANNED — mapped to the pattern 101/201 proved on Rome · ① dataset → pipeline · ②③ train → register → serve · ④⑤⑥ score · ground · reason · ⑦ human gate · ⑧ audit</text>
</svg>
