</style><defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8a8a8a"/></marker><marker id="ah" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#C0392B"/></marker></defs><rect width="1320" height="900" fill="#ffffff"/><rect x="20" y="44" width="250" height="812" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="36" y="70">EXTERNAL</text><rect x="300" y="44" width="995" height="812" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/><text class="tz" x="316" y="70">OPENSHIFT SNO "ROME" · RED HAT OPENSHIFT AI 3.5</text><g class="c-gray"><rect x="35" y="100" width="220" height="120" rx="8"/><text class="th" x="145" y="128" text-anchor="middle">Published dataset</text><text class="ts" x="145" y="154" text-anchor="middle">hf.co/datasets/fenar</text><text class="ts" x="145" y="172" text-anchor="middle">revenue_assurance billing</text></g><g class="c-amber"><rect x="35" y="395" width="220" height="130" rx="8"/><text class="th" x="145" y="423" text-anchor="middle">Human approver</text><text class="ts" x="145" y="449" text-anchor="middle">the gate the graph waits</text><text class="ts" x="145" y="467" text-anchor="middle">on · escalations never</text><text class="ts" x="145" y="485" text-anchor="middle">complete alone</text></g><g class="c-green"><rect x="35" y="705" width="220" height="110" rx="8"/><text class="th" x="145" y="733" text-anchor="middle">RHOAI MaaS</text><text class="ts" x="145" y="759" text-anchor="middle">LiteLLM gateway ·</text><text class="ts" x="145" y="777" text-anchor="middle">any OpenAI endpoint</text></g><g class="c-amber"><rect x="325" y="100" width="235" height="185" rx="8"/><text class="th" x="442" y="128" text-anchor="middle">Fraud-model pipeline</text><text class="ts" x="442" y="154" text-anchor="middle">DS Pipelines · Feast billing</text><text class="ts" x="442" y="172" text-anchor="middle">features (offline + online)</text><text class="ts" x="442" y="190" text-anchor="middle">train Balanced Random Forest</text><text class="ts" x="442" y="208" text-anchor="middle">validate · register version</text></g><g class="tab-rhoai"><rect x="343" y="90" width="126" height="20" rx="6"/><text x="406" y="104" text-anchor="middle">RHOAI · Pipelines</text></g><g class="c-green"><rect x="585" y="100" width="235" height="185" rx="8"/><text class="th" x="702" y="128" text-anchor="middle">Fraud model · KServe</text><text class="ts" x="702" y="154" text-anchor="middle">revenueassurance BRF</text><text class="ts" x="702" y="172" text-anchor="middle">served behind REST,</text><text class="ts" x="702" y="190" text-anchor="middle">never embedded in the agent</text><text class="ts" x="702" y="208" text-anchor="middle">the score is an INPUT to</text><text class="ts" x="702" y="226" text-anchor="middle">reasoning, not the decision</text></g><g class="tab-rhoai"><rect x="603" y="90" width="107" height="20" rx="6"/><text x="656" y="104" text-anchor="middle">RHOAI · KServe</text></g><g class="c-blue"><rect x="845" y="100" width="190" height="185" rx="8"/><text class="th" x="940" y="128" text-anchor="middle">Feast</text><text class="ts" x="940" y="154" text-anchor="middle">billing features</text><text class="ts" x="940" y="172" text-anchor="middle">online + offline</text><text class="ts" x="940" y="190" text-anchor="middle">grounds each case</text></g><g class="tab-rhoai"><rect x="863" y="90" width="152" height="20" rx="6"/><text x="939" y="104" text-anchor="middle">RHOAI · Feature Store</text></g><g class="c-blue"><rect x="1055" y="100" width="220" height="185" rx="8"/><text class="th" x="1165" y="128" text-anchor="middle">MLflow</text><text class="ts" x="1165" y="154" text-anchor="middle">workspace agent-school</text><text class="ts" x="1165" y="172" text-anchor="middle">fraud-training runs ·</text><text class="ts" x="1165" y="190" text-anchor="middle">registry · graph-node</text><text class="ts" x="1165" y="208" text-anchor="middle">spans + audit per case</text></g><g class="tab-rhoai"><rect x="1073" y="90" width="107" height="20" rx="6"/><text x="1126" y="104" text-anchor="middle">RHOAI · MLflow</text></g><g class="c-agent"><rect x="560" y="400" width="410" height="205" rx="12"/><text class="agent-t" x="765" y="442" text-anchor="middle">Fraud-triage agent</text><text class="ts" x="765" y="466" text-anchor="middle">LangGraph state machine · CPU-only · UBI9 · restricted PSS</text><text class="agent-flow" x="765" y="502" text-anchor="middle">score → context → decide</text><text class="ts" x="765" y="530" text-anchor="middle">clear · hold · escalate · approval gate (interrupt + checkpoint,</text><text class="ts" x="765" y="548" text-anchor="middle">resume only on human approval) · audit writer externalizes each case</text></g><g class="tab-pod"><rect x="576" y="389" width="64" height="23" rx="6"/><text x="608" y="405" text-anchor="middle">POD</text></g><g class="c-green"><rect x="1010" y="415" width="270" height="150" rx="8"/><text class="th" x="1145" y="443" text-anchor="middle">vLLM on RHOAI (KServe)</text><text class="ts" x="1145" y="469" text-anchor="middle">reasoning for the decide node</text><text class="ts" x="1145" y="487" text-anchor="middle">OpenAI-compatible /v1 ·</text><text class="ts" x="1145" y="505" text-anchor="middle">stateless, swappable</text></g><g class="tab-rhoai"><rect x="1028" y="405" width="107" height="20" rx="6"/><text x="1081" y="419" text-anchor="middle">RHOAI · KServe</text></g><polyline class="arrow-h" points="680,400 680,287" marker-end="url(#ah)"/><text class="tl" x="666" y="360" text-anchor="middle">①</text><polyline class="arrow-h" points="900,400 900,287" marker-end="url(#ah)"/><text class="tl" x="886" y="360" text-anchor="middle">②</text><polyline class="arrow-h" points="970,470 1006,470" marker-end="url(#ah)"/><text class="tl" x="988" y="462" text-anchor="middle">③</text><polyline class="arrow-h" points="950,400 950,360 1150,360 1150,287" marker-end="url(#ah)"/><text class="tl" x="978" y="350" text-anchor="middle">④</text><polyline class="arrow-h" points="560,500 258,500" marker-end="url(#ah)"/><text class="tl" x="410" y="492" text-anchor="middle">⑤ escalate</text><polyline class="arrow" points="255,150 321,170" marker-end="url(#a)"/><text class="tl" x="290" y="146" text-anchor="middle">pull</text><polyline class="arrow" points="585,175 562,175" marker-end="url(#a)"/><text class="tl" x="560" y="150" text-anchor="middle">register → serve</text><polyline class="arrow" points="845,190 823,190" marker-end="url(#a)"/><text class="tl" x="832" y="182" text-anchor="middle">features</text><polyline class="arrow dashed" points="145,705 145,548 556,548" marker-end="url(#a)"/><text class="tl" x="350" y="542" text-anchor="middle">alt LLM path · same OpenAI contract</text><text class="tl" x="660" y="812" text-anchor="middle">Tabs: red POD = a Pod you ship (a workload) · blue = the RHOAI platform feature/service · left column = external</text><text class="ts" x="660" y="835" text-anchor="middle">① score · fraud model as a tool · ② context · Feast billing features · ③ decide · reason via vLLM · ④ audit → MLflow · ⑤ escalate → human approval gate</text><text class="ts" x="660" y="876" text-anchor="middle">Fraud Triage architecture</text></svg>