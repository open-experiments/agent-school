<svg viewBox="0 0 1180 790" width="1180" height="790" xmlns="http://www.w3.org/2000/svg">
<style>
text { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
.th { font-size: 14px; font-weight: 600; fill: #2a2a2a; }
.ts { font-size: 12px; font-weight: 400; fill: #5f5f5f; }
.tz { font-size: 13px; font-weight: 600; fill: #6b6b6b; letter-spacing: .4px; }
.tl { font-size: 11.5px; font-weight: 500; fill: #6b6b6b; }
.c-blue rect { fill: #E6F1FB; stroke: #185FA5; stroke-width: 1.25; }
.c-blue .th { fill: #0C447C; } .c-blue .ts { fill: #185FA5; }
.c-teal rect { fill: #E0F4F2; stroke: #0E7569; stroke-width: 1.25; }
.c-teal .th { fill: #084D45; } .c-teal .ts { fill: #0E7569; }
.c-amber rect { fill: #FCF2DF; stroke: #9A6700; stroke-width: 1.25; }
.c-amber .th { fill: #6B4A00; } .c-amber .ts { fill: #9A6700; }
.c-green rect { fill: #E5F4E5; stroke: #1F7A33; stroke-width: 1.25; }
.c-green .th { fill: #114D1F; } .c-green .ts { fill: #1F7A33; }
.c-gray rect { fill: #F2F2F1; stroke: #8a8a8a; stroke-width: 1.25; }
.c-gray .th { fill: #3A3A3A; } .c-gray .ts { fill: #6B6B6B; }
.arrow { stroke: #8a8a8a; stroke-width: 1.5; fill: none; }
.dashed { stroke-dasharray: 5 4; }
</style>
<defs><marker id="a" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="#8a8a8a"/></marker></defs>
<rect width="1180" height="790" fill="#ffffff"/>

<!-- Zone: External -->
<rect x="15" y="30" width="210" height="690" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text class="tz" x="30" y="56">EXTERNAL</text>

<g class="c-gray">
<rect x="30" y="100" width="175" height="120" rx="8"/>
<text class="th" x="117" y="130" text-anchor="middle">Published dataset</text>
<text class="ts" x="117" y="152" text-anchor="middle">hf.co/datasets/fenar</text>
<text class="ts" x="117" y="170" text-anchor="middle">(revenue_assurance:</text>
<text class="ts" x="117" y="188" text-anchor="middle">telecom billing records)</text>
</g>

<g class="c-amber">
<rect x="30" y="260" width="175" height="120" rx="8"/>
<text class="th" x="117" y="290" text-anchor="middle">Human approver</text>
<text class="ts" x="117" y="312" text-anchor="middle">the gate the graph</text>
<text class="ts" x="117" y="330" text-anchor="middle">waits on — escalations</text>
<text class="ts" x="117" y="348" text-anchor="middle">never complete alone</text>
</g>

<g class="c-green">
<rect x="30" y="560" width="175" height="110" rx="8"/>
<text class="th" x="117" y="590" text-anchor="middle">RHOAI MaaS</text>
<text class="ts" x="117" y="612" text-anchor="middle">LiteLLM gateway ·</text>
<text class="ts" x="117" y="630" text-anchor="middle">any OpenAI-compatible</text>
<text class="ts" x="117" y="648" text-anchor="middle">endpoint</text>
</g>

<!-- Zone: Cluster -->
<rect x="250" y="30" width="910" height="690" rx="10" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text class="tz" x="266" y="56">OPENSHIFT SNO "ROME" · RED HAT OPENSHIFT AI 3.5</text>

<!-- Fraud-model pipeline -->
<g class="c-amber">
<rect x="280" y="90" width="250" height="240" rx="8"/>
<text class="th" x="405" y="118" text-anchor="middle">Fraud-model pipeline (Jobs)</text>
<text class="ts" x="405" y="146" text-anchor="middle">Feast: billing features</text>
<text class="ts" x="405" y="164" text-anchor="middle">(offline + online)</text>
<text class="ts" x="405" y="190" text-anchor="middle">train Balanced Random Forest</text>
<text class="ts" x="405" y="208" text-anchor="middle">validate · register version</text>
<text class="ts" x="405" y="236" text-anchor="middle">the same pipeline pattern</text>
<text class="ts" x="405" y="254" text-anchor="middle">101 proved live on Rome —</text>
<text class="ts" x="405" y="272" text-anchor="middle">here applied to the</text>
<text class="ts" x="405" y="290" text-anchor="middle">revenueassurance models</text>
</g>

<!-- KServe fraud model -->
<g class="c-green">
<rect x="560" y="90" width="260" height="240" rx="8"/>
<text class="th" x="690" y="118" text-anchor="middle">Fraud model on KServe</text>
<text class="ts" x="690" y="146" text-anchor="middle">revenueassurance BRF /</text>
<text class="ts" x="690" y="164" text-anchor="middle">Transformer</text>
<text class="ts" x="690" y="192" text-anchor="middle">pattern 2: served behind REST,</text>
<text class="ts" x="690" y="210" text-anchor="middle">never embedded in the agent</text>
<text class="ts" x="690" y="238" text-anchor="middle">the score is an input to</text>
<text class="ts" x="690" y="256" text-anchor="middle">reasoning — never the decision</text>
<text class="ts" x="690" y="274" text-anchor="middle">on high-risk paths</text>
</g>

<!-- MLflow -->
<g class="c-blue">
<rect x="850" y="90" width="280" height="240" rx="8"/>
<text class="th" x="990" y="118" text-anchor="middle">MLflow · workspace agent-school</text>
<text class="ts" x="990" y="146" text-anchor="middle">Experiments: fraud-training runs</text>
<text class="ts" x="990" y="170" text-anchor="middle">Registry: fraud-model versions</text>
<text class="ts" x="990" y="194" text-anchor="middle">(graduate to serving)</text>
<text class="ts" x="990" y="222" text-anchor="middle">Traces: graph-node spans +</text>
<text class="ts" x="990" y="240" text-anchor="middle">audit trail per case</text>
<text class="ts" x="990" y="268" text-anchor="middle">Develop &amp; train →</text>
<text class="ts" x="990" y="286" text-anchor="middle">Experiments · Feature store</text>
</g>

<!-- Agent pod -->
<g class="c-gray">
<rect x="280" y="400" width="530" height="300" rx="8"/>
<text class="th" x="296" y="426">Fraud-triage agent pod — LangGraph state machine (CPU-only)</text>
</g>
<g class="c-teal">
<rect x="300" y="440" width="150" height="100" rx="8"/>
<text class="th" x="375" y="470" text-anchor="middle">score</text>
<text class="ts" x="375" y="492" text-anchor="middle">fraud model</text>
<text class="ts" x="375" y="510" text-anchor="middle">as a tool</text>
</g>
<g class="c-teal">
<rect x="470" y="440" width="150" height="100" rx="8"/>
<text class="th" x="545" y="470" text-anchor="middle">context</text>
<text class="ts" x="545" y="492" text-anchor="middle">billing records</text>
<text class="ts" x="545" y="510" text-anchor="middle">ground the case</text>
</g>
<g class="c-teal">
<rect x="640" y="440" width="150" height="100" rx="8"/>
<text class="th" x="715" y="470" text-anchor="middle">decide</text>
<text class="ts" x="715" y="492" text-anchor="middle">clear · hold ·</text>
<text class="ts" x="715" y="510" text-anchor="middle">escalate</text>
</g>
<g class="c-amber">
<rect x="300" y="580" width="230" height="100" rx="8"/>
<text class="th" x="415" y="606" text-anchor="middle">approval gate</text>
<text class="ts" x="415" y="628" text-anchor="middle">interrupt() · checkpoint ·</text>
<text class="ts" x="415" y="646" text-anchor="middle">resume only on human approval</text>
</g>
<g class="c-gray">
<rect x="560" y="580" width="230" height="100" rx="8"/>
<text class="th" x="675" y="606" text-anchor="middle">audit writer</text>
<text class="ts" x="675" y="628" text-anchor="middle">score · context · decision ·</text>
<text class="ts" x="675" y="646" text-anchor="middle">approver — externalized</text>
</g>

<!-- vLLM -->
<g class="c-green">
<rect x="850" y="440" width="280" height="150" rx="8"/>
<text class="th" x="990" y="470" text-anchor="middle">vLLM on RHOAI (KServe)</text>
<text class="ts" x="990" y="494" text-anchor="middle">reasoning for the decide node</text>
<text class="ts" x="990" y="514" text-anchor="middle">OpenAI-compatible /v1 ·</text>
<text class="ts" x="990" y="532" text-anchor="middle">stateless, swappable</text>
</g>

<!-- Arrows -->
<line class="arrow" x1="205" y1="150" x2="274" y2="150" marker-end="url(#a)"/>
<text class="tl" x="240" y="140" text-anchor="middle">①</text>

<polyline class="arrow" points="405,90 405,70 990,70 990,86" marker-end="url(#a)"/>
<text class="tl" x="700" y="64" text-anchor="middle">② runs · registered fraud-model versions</text>

<line class="arrow" x1="530" y1="150" x2="554" y2="150" marker-end="url(#a)"/>
